      # name, a price move, a coin amount) next to crypto market words.
      - pattern: "\\$DOGE\\b|\\bDOGE[/-](?:USDT?|USDC|KRW|BTC|EUR)\\b|\\bKRW-DOGE\\b|\\bDOGEUSD[TC]?\\b|\\bDOGE (?:(?:ETFs?|ETPs?|ETNs?|exchange-traded|Trust(?! [Ff]unds?\\b)|futures|tokens?|holdings(?! of [a-z])|holders)\\b|[Tt]reasury (?:[Cc]ompan|[Ss]trateg|[Ff]irm|[Vv]ehicle))|\\bDOGE(?:['’]s)? price (?:(?:jump|fall|rise|slide|drop|climb|surge|soar|slump|sink|tumble|hold|gain|dip|spike|crash|rebound|recover)(?:s|es|d|ed|ing)?|rose|fell|slid|sank|rall(?:y|ies|ied|ying)|prediction|analysis|action|chart|today|outlook|forecast)\\b|(?<![\\w$.,])(?!(?:19|20)\\d\\d\\b)\\d[\\d,.]*(?: (?:million|billion|thousand))? DOGE\\b(?=\\s*(?:$|[.;:)]|,(?!\\s*[A-Z])|tokens?\\b|coins?\\b|worth\\b|to\\b|from\\b|for\\b|into\\b))"
        requires: "dogecoin|crypto|digital asset|\\btoken|\\b\\w*coins?\\b|Coinbase|\\bETFs?\\b|\\bETPs?\\b|Grayscale|Bitwise|21Shares|Osprey|memecoin|meme coin|wallet|futures|\\bspot\\b"

  - id: monero
    kind: project
    label: Monero
    tokens: [XMR]
    match:
      # The name, but not the 2018 forks and imitators (Monero Classic,
      # Monero-Classic, Monero Original, Monero 0 / Zero, MoneroV, Monero Gold)
      # or Wrapped Monero, in title case or all caps. "Monero 0.18", "Monero
      # Zero-Day" and "Monero Gold Rush" still match. Texts naming the actor
      # Mark Monero are skipped, so a later bare "Monero" in the same story does
      # not match. Moneroo, Monerium and Wownero do not match \bMonero\b.
      - pattern: "(?<!Wrapped )(?<!wrapped )(?<!WRAPPED )\\b(?:Monero|MONERO)\\b(?! ?(?:Classic|CLASSIC|Original|ORIGINAL|Gold(?! Rush)|GOLD(?! RUSH)|Zero(?![\\w-])|ZERO(?![\\w-])|0(?![\\w-]|\\.\\w))|-Classic)"
        requires: "^(?![\\s\\S]*(?-i:\\bM(?:ark|ARK) M(?:onero|ONERO)\\b))"
      # The ticker, next to crypto context, but not Wrapped XMR, the XMR-Stak
      # miner (like XMRig, malware news that does not name Monero), and not
      # XMReality's Nasdaq Stockholm ticker (XMR:SS, XMR.ST, XMR SS,
      # STO: XMR, or any text naming XMReality), the Cape Canaveral Skid Strip
      # (FAA code XMR), XMR X-ray/MR imaging suites or PlayReady XMR licences.
      - pattern: "(?<![:.])(?<!STO: )(?<!Wrapped )(?<!wrapped )\\bXMR\\b(?![:.](?:SS|ST)\\b| SS\\b|-Stak)"
        requires: "^(?![\\s\\S]*(?:XMReality|Skid Strip|Cape Canaveral|PlayReady|X-ray(?: and |/)MR|magnetic resonance|\\bMRI\\b))[\\s\\S]*?(?:Monero|모네로|crypto|암호화폐|가상자산|coin|코인|token|privacy|wallet|mining|miner|hashrate|delist|blockchain|digital (?:asset|currency)|virtual (?:asset|currency)|ransom|darknet|sanction|MiCA|Kraken|Binance|\\bOKX\\b|decentrali[sz]ed|Haveno|\\$XMR|XMR/|/XMR|\\bXMR-(?:USDT?|USDC|BTC|ETH|EUR|KRW)\\b|\\b(?:KRW|BTC|USDT)-XMR\\b)"

  - id: whitebit
    kind: project
    label: WhiteBIT / WBT
    tokens: [WBT]
    match:
      - pattern: "\\bwhitebit\\b"
        ignore_case: true
      - pattern: "\\bWhitechain\\b"
      # WBT is also Weebit Nano (ASX: WBT, WBT.AX, Bloomberg WBT AU, "$WBT" on
      # social media; its product is ReRAM), Welbilt (NYSE: WBT until 2022), the
      # Charlotte radio station WBT / WBT-FM, web-based training and wet-bulb
      # temperature. The bare ticker needs exchange-token context and is skipped
      # when the text names one of those. "to/can/may/will exchange tokens" is a
      # verb phrase; the \b keeps "crypto exchange tokens" in.
      - pattern: "(?<!ASX:)(?<!ASX: )(?<!NYSE:)(?<!NYSE: )(?<!Nano \\()(?<!Welbilt \\()\\bWBT\\b(?!\\.AX)"
        requires: "^(?![\\s\\S]*(?:Weebit|\\bReRAM\\b|\\bWBT[ .:]AU\\b|Welbilt|\\bASX\\b|\\bradio\\b|Charlotte|WBT-FM|web[- ]based training|\\be-?learning|wet[- ]bulb|World Bank(?:'s)? Treasury))(?=[\\s\\S]*(?:\\bWBT ?(?:tokens?|coins?|ETFs?|ETPs?)\\b|\\bWBT ?/ ?(?:USDT?|USDC|EUR|BTC)\\b|\\$WBT\\b(?!\\.)|(?<!\\bcan )(?<!\\bto )(?<!\\bmay )(?<!\\bwill )\\bexchange[- ]tokens?\\b|\\bCEX tokens?\\b|centrali[sz]ed crypto(?:currency)? exchange))"

  - id: cardano
    kind: project
    label: Cardano
    tokens: [ADA]
    match:
      # Cardano's own organisations and unambiguous product phrases, plus the
      # Korean forms 카르다노(ADA), 에이다(ADA) and 카르다노 재단.
      - pattern: "(?:Cardano|CARDANO) (?:Foundation|FOUNDATION)|카르다노 ?재단|\\bIOHK\\b|Input Output Hong Kong|\\bEMURGO\\b|\\bEmurgo\\b|Charles Hoskinson|CHARLES HOSKINSON|\\b(?:Cardano|CARDANO)(?: Trust| TRUST)? (?:ETFs?|ETPs?|[Ff]utures|FUTURES|[Bb]lockchain|BLOCKCHAIN|[Nn]etwork|NETWORK|[Mm]ainnet|[Ee]cosystem|[Nn]odes?|[Hh]ard [Ff]ork|[Ss]mart [Cc]ontracts?|[Ww]allets?|[Ss]tablecoins?|DeFi|[Ss]take [Pp]ools?|[Ss]taking|STAKING)\\b|\\b(?:Cardano|CARDANO) \\(ADA\\)|(?:카르다노|에이다) ?\\(ADA\\)"
      # Input Output Global (IOG, also written "Input | Output"). "Input Output"
      # is an economics term ("Input Output Global Value Chains", "... Global
      # Tables"), so the company name needs crypto context.
      - pattern: "Input (?:\\| )?Output Global\\b(?! [Vv]alue| [Ss]upply| [Tt]rade| [Pp]roduction| [Tt]ables?| [Dd]atabases?| [Mm]odels?| [Ll]inkages?)"
        requires: "Cardano|crypto(?!graph|log)|blockchain|on-?chain|tokeni[sz]|(?<!same )\\btokens?\\b(?! of\\b)|staking|\\bDeFi\\b|smart contracts?|stablecoin|digital assets?|Hoskinson|(?-i:\\bADA\\b)"
      # Bare "Cardano" collides with Cardano Group (Dutch/UK pensions, LDI and
      # fiduciary manager bought by Mercer in 2024; Cardano Risk Management,
      # Cardano Advisory, Cardano Development, ACTIAM), the mathematician
      # Gerolamo Cardano (Cardano's formula, the Cardano grille cipher, his
      # dice and games of chance) and the town Cardano al Campo. The whole rule
      # is skipped when the text uses pension-industry words, so the group's
      # comments on crypto or tokenised gilts do not count. "crypto" skips
      # "cryptography" and "cryptologic"; "stake" alone and "coin" alone are
      # left out because pension news uses them ("takes a stake", "the other
      # side of the coin"); "Grayscale" counts only capitalised, since
      # steganography papers hide text in "grayscale" images. A pension story
      # that names the coin only as bare "Cardano" is missed; "Cardano ETF"
      # and the other rule-1 phrases still match it.
      - pattern: "(?:(?<!Gerolamo )(?<!Girolamo )(?<!Jerome )(?<!manager )(?<!specialist )(?<!consultancy )(?<!consultant )(?<!adviser )(?<!advisor )(?<!pensions firm )(?<!pension firm )(?<!investment firm )\\b(?:Cardano|CARDANO)\\b(?! (?i:al Campo)| (?:Group|GROUP|Risk|RISK|Investments?|INVESTMENTS?|Development|DEVELOPMENT|Asset|ASSET|Advisory|ADVISORY|ACTIAM|Actiam|Insights|INSIGHTS|Pensions?|PENSIONS?|Holdings?|HOLDINGS?|UK|NL|Nederland|Netherlands|Rotterdam|Sustainable|SUSTAINABLE|Ltd|LTD|Limited|LIMITED)\\b| B\\.V\\.| (?i:grille|grid|cipher|formula|method|joint|shaft)\\b|['’]s (?i:formula|method|rule|solution|grille|grid|cipher|cubic|dice|games?)\\b|,? (?:the|a) (?:Dutch|UK|British|London|Rotterdam|pensions?|investment|fiduciary|risk|LDI|asset|advisory|sustainable|Renaissance|Italian)\\b)|카르다노(?!의? ?(?:공식|해법|방법|격자)))"
        requires: "^(?![\\s\\S]*(?:pension|\\bLDI\\b|liability[- ]driven|defined[- ]benefit|\\bgilts?\\b|\\bMercer\\b|fiduciary manag|\\btrustees\\b|\\bDB schemes?\\b|ACTIAM|al Campo|Malpensa|Gerolamo|Girolamo|연금|연기금|머서|지롤라모))(?=[\\s\\S]*(?:crypto(?!graph|log)|blockchain|(?-i:\\bADA\\b|\\bIOG\\b|Grayscale)|tokeni[sz]|(?<!same )\\btokens?\\b(?! of\\b)|on-?chain|staking|stake pools?|\\bDeFi\\b|smart contracts?|stablecoin|digital assets?|virtual assets?|altcoin|\\bmainnet\\b|hard fork|\\bdApps?\\b|\\bWeb3\\b|proof[- ]of[- ]stake|Hoskinson|Bitcoin|Ethereum|Solana|\\bXRP\\b|Chainlink|Polkadot|Dogecoin|Litecoin|Hedera|Coinbase|Binance|Kraken|Upbit|\\bBTC\\b|가상자산|암호화폐|가상화폐|디지털 ?자산|블록체인|스테이킹|비트코인|이더리움|업비트|빗썸|그레이스케일))"
      # ADA is also the Americans with Disabilities Act, the Antideficiency
      # Act, the American Dental/Diabetes Association, an Assistant District
      # Attorney and Adacel Technologies (ASX: ADA), so the bare ticker never
      # matches. Only crypto-specific phrases and market pairs do ("ADA coin"
      # but not "ADA coin-operated machines" or "ADA coin slots"), and not in
      # disability or transit text ("ADA tokens" for paratransit fares).
      - pattern: "\\bADA (?:tokens?|coins?(?![- ](?:operated|slots?|mechanisms?|returns?|box(?:es)?|changers?|acceptors?|machines?)\\b)|holders|staking|stakers|whales|ETFs?|ETPs?|[Ff]utures|spot ETF)\\b|\\b(?:KRW|USDT?|BTC)-ADA\\b|\\bADA[-/](?:USD[TC]?|KRW|BTC|ETH|EUR)\\b"
        requires: "^(?![\\s\\S]*(?:disabilit|Americans with|paratransit|wheelchair|\\bDental\\b|Diabetes|District Attorney|Antideficiency))"
      # The $ADA cashtag is also Adacel Technologies on the ASX.
      - pattern: "(?<!Adacel \\()(?<!Adacel Technologies \\()(?<!ASX: )(?<!ASX:)\\$ADA\\b"
        requires: "^(?![\\s\\S]*(?:Adacel|\\bASX\\b))(?=[\\s\\S]*(?:Cardano|crypto(?!graph|log)|altcoin|staking|\\bDeFi\\b|on-?chain|blockchain|\\bwhales?\\b|(?<!same )\\btokens?\\b(?! of\\b)|\\$BTC|\\$ETH|\\$XRP|\\$SOL|\\$DOGE|\\$LINK|\\$HBAR|\\$XLM))"
      # Ticker lists. DOT is left out (Department of Transportation and ADA
      # rules); DOGE (the Government Efficiency department), SOL (statute of
      # limitations) and LTC (long-term care) sit next to the disability ADA in
      # legal and benefits news, so the rule is skipped when the text uses
      # disability or legal words. "coinsurance" is not a coin. "accessible"
      # alone is allowed ("makes BTC, ETH and ADA accessible to investors").
      - pattern: "\\b(?:BTC|ETH|XRP|SOL|XLM|HBAR|DOGE|AVAX|LTC|TRX|BNB|SUI|LINK|SHIB|XMR)(?:,| and| or| &| /) ADA\\b(?! (?:claims?|lawsuits?|suits?|complian\\w*|violations?|rules?|requirements?|accessibility|Title|standards?|litigation|plaintiffs?|regulations?|coordinators?|accommodations?|guidelines?)\\b)|\\bADA(?:,| and| or| &| /) (?:BTC|ETH|XRP|SOL|XLM|HBAR|DOGE|AVAX|LTC|TRX|BNB|SUI|LINK|SHIB|XMR)\\b"
        requires: "^(?![\\s\\S]*(?:disabilit|Americans with|inaccessib|wheelchair|paratransit|screen[- ]readers?|Government Efficiency|statute of limitations|Antideficiency|Dental|Diabetes|District Attorney))(?=[\\s\\S]*(?:crypto(?!graph|log)|altcoin|(?<!same )\\btokens?\\b(?! of\\b)|\\b\\w*coins?\\b|Coinbase|blockchain|staking|\\bDeFi\\b|\\bETFs?\\b|\\bETPs?\\b|digital assets?|futures|on-?chain))"

  - id: rain
    kind: project
    label: Rain
    tokens: [RAIN]
    # Rain prediction-markets protocol on Arbitrum (Rain Foundation, Panama; rain.one).
    # Not: Rain the stablecoin card issuer (rain.xyz), the Bahrain exchange Rain,
    # Rain Enhancement Technologies (Nasdaq: RAIN), Rain Oncology (former Nasdaq:
    # RAIN), RAIN RFID, Rainmaker/Raindrop/Rain Coin/Rain by Virtuals ($RAIN),
    # rainlang/Raindex, RAIN Foundation (water NGO), the RAIN mindfulness acronym
    # or the weather. Bare "Rain" needs Enlivex (its treasury holder) or the CEO nearby.
    # Texts about cards are skipped by rules 1, 2 (Arbitrum branch) and 4: that is
    # the card issuer's vocabulary (Visa/Mastercard/Polymarket cards, card rewards).
    match:
      # Names. rainlang/Raindex used "Rain Protocol" and deploys on Arbitrum;
      # the mindfulness "RAIN Protocol" spells out Recognize, Allow, ...;
      # Virtuals' AI agent is also written "Rain (RAIN)". Those texts are skipped.
      - pattern: "\\b(?:Rain|RAIN) (?:Protocol|Foundation|V2|DAO)\\b|\\bRain \\(\\$?RAIN\\)"
        requires: "^(?![\\s\\S]*(?:Raindex|rainlang|Rain Language|Recogni[sz]e,? Allow|mindful|Virtuals|\\bcards?\\b))(?=[\\s\\S]*(?:prediction[- ]markets?|options (?:protocol|markets?)|Arbitrum|Polymarket|Kalshi|Enlivex|\\bENLV\\b|Roy Shaham|rain\\.one|\\bTVL\\b|(?-i:\\bRAIN tokens?\\b|\\$RAIN\\b)))"
      # Bare ticker. Skipped after an exchange prefix and inside "Name (RAIN)" /
      # "Name ($RAIN)" (except "token (RAIN)"), which is how Rainmaker, Raindrop,
      # Rain Coin, Rain Enhancement and Rain Oncology are written ("Rain (RAIN)"
      # is rule 1). All-caps headlines about the card issuer or the Bahrain
      # exchange also say ARBITRUM, so Arbitrum counts only together with
      # prediction/options markets, and not when another RAIN token is named.
      - pattern: "(?<!Nasdaq: )(?<!NASDAQ: )(?<!Nasdaq:)(?<!NASDAQ:)(?:(?<=\\b[Tt]oken \\()|(?<=\\b[Tt]oken \\(\\$)|(?<![A-Za-z] \\()(?<![A-Za-z] \\(\\$))\\bRAIN\\b(?! RFID| Alliance| [Tt]echnology| \\((?:Rainmaker|Raindrop|Rain Coin|Rain by Virtuals))"
        requires: "Enlivex|\\bENLV\\b|Roy Shaham|rain\\.one|^(?![\\s\\S]*(?:\\bcards?\\b|Rainmaker|Raindrop|Rain Coin|Virtuals))(?=[\\s\\S]*Arbitrum)(?=[\\s\\S]*(?:prediction|options)[- ]markets?)"
      # Stock-mover lists put Enlivex next to Rain Enhancement / Rain Oncology.
      - pattern: "\\bRain\\b(?! Enhancement| Oncology| Industries| Carbon| Bird)"
        requires: "Enlivex|\\bENLV\\b|Roy Shaham|rain\\.one"
      # Descriptive phrasings. The card issuer (Polymarket/Visa cards, Arbitrum
      # DAO card rewards) and the Bahrain exchange (launching prediction
      # markets) use the same words, so texts naming cards or Bahrain are skipped.
      # "Arbitrum's Rain of ...", "Rain Check" and "Rain-..." are figurative.
      - pattern: "\\bRain['’]s (?:decentrali[sz]ed )?(?:prediction|options)[- ]markets?|\\bRain,? (?:is |was )?(?:an?|the) (?:(?:Arbitrum-based|decentrali[sz]ed|permissionless|on-?chain|AI-powered|leading) )*(?:prediction|options)[- ]markets? (?:protocol|platform|infrastructure)|\\bRain, (?:an?|the) (?:Arbitrum-based|decentrali[sz]ed) (?:prediction|options)[- ]markets?\\b|(?:Arbitrum(?:-based|['’]s)? (?:prediction|options)[- ]markets?(?: (?:protocol|platform|project))?|(?:prediction|options)[- ]markets? (?:protocol|platform|project|token)) Rain\\b(?!-)|Arbitrum(?:-based|['’]s) Rain\\b(?!-| of\\b| [Cc]heck)"
        requires: "^(?![\\s\\S]*(?:Bahrain|\\bcards?\\b))"

  # --- themes (stored for later search; no event on their own) ---------------
  - id: tokenized_deposits
    kind: theme
    label: tokenized deposits
    match:
      - pattern: "tokeni[sz]ed deposits?|deposit tokens?"
        ignore_case: true

  - id: tokenization
    kind: theme
    label: tokenization
    match:
      - pattern: "tokeni[sz]ation|tokeni[sz]ed (?:funds?|assets?|treasur|money market|securities|bonds?|MMF)"
        ignore_case: true

  - id: stablecoin
    kind: theme
    label: stablecoin
    match:
      - pattern: "stablecoins?"
        ignore_case: true

  - id: collateral
    kind: theme
    label: collateral
    match:
      - pattern: "tokeni[sz]ed collateral|collateral mobility|on-?chain collateral|collateral management"
        ignore_case: true

  - id: crypto_etf
    kind: theme
    label: crypto ETF
    match:
      - pattern: "\\bETFs?\\b|\\bETPs?\\b"
        requires: "crypto|XRP|Chainlink|Hedera|Stellar|HBAR|\\bLINK\\b|XLM|Quant|Ondo|bitcoin|ether"

  - id: industry_event
    kind: theme
    label: industry event
    match:
      - pattern: "Sibos|Money ?20/20|SmartCon"
