# Entities matched against item titles and excerpts.
#
# kind: institution | project | theme
#   institution + project in the same item  -> "high" alert (connection candidate)
#   project in an institution/regulator feed -> "medium" alert
#   theme only                               -> stored for later search, no event
# match: a list of rules. A rule matches when `pattern` is found and, if given,
#   `requires` is also found (context words, case-insensitive).
#   Patterns are case-sensitive unless ignore_case: true.
# tokens: token symbols linked to a project (docs/institution-map.md).
# control: true for the same-narrative control group (docs/open-questions.md Q7).
#
# Matching only proposes candidates. Connection grades and business stages are
# decided by review (docs/research-principles.md sections 2 and 4).

x-context:
  finance: &fin "tokeni[sz]|blockchain|crypto|digital asset|stablecoin|on-?chain|ledger|\\bDLT\\b|deposit token|settlement"
  payments: &pay "bank|payment|ledger|blockchain|Sibos|tokeni[sz]|messag|interbank|cross-border|ISO 20022|stablecoin|settlement"
  # Validated on the etf group's real headlines (research/2026-10-01-claude-institution-entities).
  crypto_asset: &crypto_asset "\\bcrypto(?!graph)|bitcoin|(?<!into the )\\bether\\b|ethereum|solana|\\bXRP\\b|dogecoin|cardano (?:ETFs?|blockchain|network|ecosystem|staking|\\(ADA)|chainlink|stellar lumens|hedera|\\bHBAR\\b|litecoin|avalanche (?:network|blockchain|ETF)|\\bAVAX\\b|polkadot|(?-i:\\b(?:BTC|ETH|SOL|BNB|SUI|USD[CT])\\b)|stablecoin|tokeni[sz]|(?<!same )(?<!AI )(?<!inference )\\btokens?\\b(?! gesture| per second)|\\bDeFi\\b|blockchain|on-?chain|distributed ledger|\\bDLT\\b|digital (?:assets?|currenc)|\\bCBDC|altcoin|meme ?coin|\\bNFTs?\\b|web3|\\bhodl\\b|coinbase|binance|\\bspot (?!gold|silver|oil)(?:[\\w-]+ ){0,2}?ET[FP]s?\\b"
  # Validated on the exchange group's real headlines (research/2026-10-01-claude-institution-entities).
  # Crypto context for institutions whose other news is not crypto: crypto words; any "...coin(s)" (bitcoin, dogecoin, litecoin, stablecoin, altcoin, memecoin); major asset names and tickers, and altcoin ETF names ("NEAR ETF"); tokens and tokenized assets; staking, DeFi, NFTs, perps; crypto laws and licences; Korean terms. Not "settlement" or "ledger" (legal settlements, general ledgers).
  crypto_exchange: &crypto_exchange "crypto(?!graph)|\\w+coins?\\b|\\bether(?:eum)?\\b|solana|\\bXRP\\b|cardano|chainlink|stellar lumens|hedera|\\bHBAR\\b|\\bAVAX\\b|polkadot|shiba inu|monero|zcash|(?-i:Hyperliquid|\\b(?:BTC|ETH(?! Z)|SOL|XLM|BNB|TRX|SUI|USD[CT])\\b|\\bMiCAR?\\b)|\\btokens?\\b|tokeni[sz]|blockchain|on-?chain|digital (?:assets?|currenc)|virtual (?:assets?|currenc)|\\bDeFi\\b|\\bNFTs?\\b|\\bweb3\\b|perpetual futures|\\bperps?\\b|BitLicense|xStocks|(?:GENIUS|CLARITY) Act|\\bstaking\\b|(?-i:\\b(?:HYPE|NEAR|SUI|DOGE|LTC|ADA|DOT|LINK|SEI|APT|INJ) ET[FP]s?\\b)|가상자산|암호화폐|코인|토큰|블록체인|이더리움|솔라나|카르다노|체인링크|스텔라"
  # Validated on the payments group's real headlines (research/2026-10-01-claude-institution-entities).
  # Crypto context: crypto words, coin and stablecoin names (also USDT0, USDCx, PYUSDx, USD₮), and a few crypto-only firms and networks.
  # Left out on purpose: bare "token(ization)" (card tokens), "settlement" (lawsuits), "wallet" (PayPal/Apple wallets), "ledger", plain "Stellar" (the adjective).
  crypto_payments: &crypto_payments "crypto(?!graph)|bitcoin|\\bBTC\\b|\\bether(?:eum)?\\b|\\bETH\\b|solana|\\bXRP\\b|\\bXLM\\b|Stellar (?:network|blockchain|Development Foundation)|dogecoin|litecoin|altcoin|meme ?coin|stablecoin|\\b(?:USD[CT]|PYUSD|USDG|RLUSD|EURC|USD1|OUSD)(?:x|0)?\\b|USD₮|Open USD|blockchain|on-?chain|mainnet|testnet|\\bDeFi\\b|web3|\\bNFTs?\\b|smart contract|self.?custod|proof.of.reserves|tokeni[sz]ed (?:deposit|asset|fund|treasur|stock|equit|securit|bond|money|gold|real|bank|share|dollar|cash)|deposit tokens?|digital (?:asset|currenc|dollar|euro|pound)|virtual (?:asset|currenc)|\\bVASPs?\\b|\\bCBDCs?\\b|distributed ledger|\\bDLT\\b|(?-i:\\bMiCA\\b)|GENIUS Act|CLARITY Act|BitLicense|Lightning Network|Canton Network|Coinbase|Binance|\\bBVNK\\b|zero ?hash|MoonPay|Fireblocks|Anchorage Digital"
  # Validated on the banks group's real headlines (research/2026-10-01-claude-institution-entities).
  # Crypto/tokenized-money words and major asset names for bank and other big-name institutions. Not "settlement" or bare "ledger" (lawsuits, general ledger), nor the adjective "stellar" or "ripple effect".
  crypto_bank: &crypto_bank "crypto(?!graph)|bitcoin|\\bBTC\\b|\\bether(?:eum)?\\b|solana|\\bXRP\\b|\\bXLM\\b|stellar (?:network|blockchain|lumens|development)|\\b(?:selects|picks|taps|uses|joins|via) stellar\\b|\\bon stellar(?![ -]\\w)|(?-i:\\bRipple\\b)(?! effects?)|\\bHedera\\b|chainlink|\\bUSD[CT]\\b|coinbase|binance|stable ?coin|tokeni[sz]|deposit tokens?|security tokens?|digital (?:assets?|bonds?|securities|currenc|money|euro|pound|dollar)|virtual assets?|\\bCBDC|blockchain|distributed ledger|\\bDLT\\b|\\bon-?chain|smart contract|\\bweb ?3\\b|\\bDeFi\\b|decentrali[sz]ed (?:exchange|finance)|\\bDEXs?\\b|\\bNFTs?\\b|Canton Network|Project Agora|Agorá"

entities:
  # --- institutions in docs/institution-map.md --------------------------------
  - id: tch
    kind: institution
    label: The Clearing House
    category: market_infrastructure
    match:
      - pattern: "The Clearing House"
      - pattern: "\\bTCH\\b"
        requires: "payment|bank|clearing|on-?chain|tokeni[sz]|\\bRTP\\b|CHIPS"

  - id: dtcc
    kind: institution
    label: DTCC
    category: market_infrastructure
    match:
      - pattern: "\\bDTCC\\b|Fund/?SERV|Depository Trust"

  - id: swift
    kind: institution
    label: Swift
    category: market_infrastructure
    match:
      - pattern: "\\bSWIFT\\b|(?<!Taylor )\\bSwift\\b"
        requires: *pay

  - id: us_bank
    kind: institution
    label: U.S. Bank
    category: bank
    match:
      # U.S. Bank / US Bank / U.S. Bancorp in crypto context; not the stadium or title-case "U.S. Bank Regulators/Stocks/Deposits".
      - pattern: "\\bU\\.?S\\.? Bank\\b(?! (?:Stadium|Regulators?|Stocks?|Shares|Deposits|Lobby|Charters?|Industry)\\b)|\\bU\\.?S\\.? Bancorp\\b"
        requires: *crypto_bank
      # Its stablecoin is crypto by name.
      - pattern: "\\bUSBDC\\b"

  - id: bvnk
    kind: institution
    label: BVNK
    category: payments_stablecoin
    match:
      - pattern: "\\bBVNK\\b"

  - id: bybit
    kind: institution
    label: Bybit
    category: exchange_broker
    match:
      - pattern: "\\bBybit\\b"

  - id: franklin_templeton
    kind: institution
    label: Franklin Templeton
    category: asset_manager
    match:
      # Franklin Templeton / Franklin Resources with crypto or tokenized-fund words; its Putnam, Lexington and other deals do not count.
      - pattern: "Franklin (?:Templeton|Resources)"
        requires: *crypto_asset
      # Its crypto ETFs and onchain fund by name or ticker ("Franklin Bitcoin ETF", EZBC, XRPZ, FOBXX); not Benjamin Franklin.
      - pattern: "(?<!Benjamin )(?<!Ben )\\bFranklin (?:Bitcoin|Ethereum|XRP|Solana|Crypto|OnChain)\\b|\\b(?:EZBC|EZET|EZPZ|XRPZ|EZRP|FOBXX)\\b"
      # Benji, its tokenized-fund platform and token, with Franklin or fund words; not Animoca's Benji Bananas or the Basenji (BENJI) memecoin.
      - pattern: "\\bBenji\\b(?! Bananas)|\\bBENJI\\b"
        requires: "Franklin|Templeton|money[- ]market|FOBXX|tokeni[sz]ed (?:fund|money|treasur)"

  - id: lfdt
    kind: institution
    label: LF Decentralized Trust
    category: other
    match:
      - pattern: "LF Decentralized Trust|Linux Foundation Decentralized Trust|\\bLFDT\\b"

  - id: ibm
    kind: institution
    label: IBM
    category: other
    match:
      - pattern: "\\bIBM\\b"
        requires: "Hedera|Hashgraph|IDTrust|blockchain|tokeni[sz]|ledger"

  - id: boe
    kind: institution
    label: Bank of England
    category: central_bank
    match:
      - pattern: "Bank of England"
        requires: "stablecoin|tokeni[sz]|blockchain|\\bDLT\\b|Synchroni[sz]|digital pound|RTGS|ledger"

  # --- other institutions (discovery, docs/research-principles.md section 1) --
  - id: jpmorgan
    kind: institution
    label: JPMorgan
    category: bank
    match:
      # The bank (also "JP Morgan" without dots, "JPMorganChase") or its CEO, in crypto context.
      - pattern: "J\\.?P\\.? ?Morgan|JPMorgan|\\bDimon\\b"
        requires: *crypto_bank
      # Its blockchain unit and deposit tokens are crypto by name.
      - pattern: "\\bKinexys\\b|JPM Coin|\\bJPMD\\b"

  - id: citi
    kind: institution
    label: Citi
    category: bank
    match:
      # Citi, Citigroup, Citibank in crypto context (Citi Field and Citi Bike news has none).
      - pattern: "\\bCiti(?:group|bank)?\\b"
        requires: *crypto_bank

  - id: bny
    kind: institution
    label: BNY
    category: bank
    match:
      # BNY, BNY Mellon, Bank of New York (Mellon) in crypto context.
      - pattern: "\\bBNY\\b|Bank of New York"
        requires: *crypto_bank

  - id: state_street
    kind: institution
    label: State Street
    category: bank
    match:
      # State Street in crypto context (street names rarely come with crypto words).
      - pattern: "State Street"
        requires: *crypto_bank

  - id: blackrock
    kind: institution
    label: BlackRock
    category: asset_manager
    match:
      # Its crypto ETF tickers: iShares Bitcoin Trust (IBIT) and iShares Ethereum Trust (ETHA).
      - pattern: "\\b(?:IBIT|ETHA)\\b"
      # BUIDL, its tokenized fund, with fund words; not BUIDL, the Japanese consultancy Securitize bought in 2019.
      - pattern: "\\bBUIDL\\b"
        requires: "BlackRock|tokeni[sz]|\\bfunds?\\b|money[- ]market|treasur|collateral|stablecoin|on-?chain|\\bAUM\\b|[mb]illion"
      # BlackRock (also "Blackrock"), iShares or CEO Larry Fink with crypto words; its private-credit, ESG and other news does not count.
      - pattern: "\\bBlack[Rr]ock\\b|\\biShares\\b|Larry Fink"
        requires: *crypto_asset

  - id: goldman
    kind: institution
    label: Goldman Sachs
    category: bank
    match:
      # Goldman Sachs, the headline short form "Goldman", or its GS DAP platform, in crypto context.
      - pattern: "\\bGoldman\\b|\\bGS DAP\\b"
        requires: *crypto_bank

  - id: visa
    kind: institution
    label: Visa
    category: payments_stablecoin
    match:
      # Visa (or VISA) with crypto context; not an immigration visa (Golden/Freedom/H-1B ... Visa, Visa program/fee/holders) or a speed yardstick ("Visa-level", "than Visa").
      - pattern: "(?<!Golden )(?<!Freedom )(?<!Nomad )(?<!H-1B )(?<!Student )(?<!Investor )(?<!Tourist )(?<!Travel )(?<!Work )(?<!Gold Card )(?<!than )\\bV(?:isa|ISA)\\b(?!-(?i:free|beating|level|like|scale)| (?i:programs?|fees?|holders?|applications?|waivers?|lottery|scheme|policy|rules|requirements|route|pathway|sponsorship|overstays?|interview)\\b)"
        requires: *crypto_payments

  - id: mastercard
    kind: institution
    label: Mastercard
    category: payments_stablecoin
    match:
      # Mastercard (MasterCard, MASTERCARD) with crypto context.
      - pattern: "\\bMaster[Cc]ard\\b|\\bMASTERCARD\\b"
        requires: *crypto_payments

  - id: euroclear
    kind: institution
    label: Euroclear
    category: market_infrastructure
    match:
      - pattern: "Euroclear|Clearstream"

  - id: nasdaq
    kind: institution
    label: Nasdaq
    category: exchange_broker
    match:
      # Nasdaq (the exchange, Nasdaq Stockholm, its Crypto Index, Calypso) with crypto context. Not the index in market wraps ("the Nasdaq", "Nasdaq hits/falls/link", Composite, 100, S&P 500, Dow), not the "Nasdaq-listed" / "(Nasdaq: XXX)" tag or "to/from Nasdaq", "Nasdaq vote" of a company moving there, and not IPO debuts.
      - pattern: "(?<![Tt]he )(?<!THE )(?<![Tt]o )(?<![Ff]rom )\\b(?:Nasdaq|NASDAQ)\\b(?![- ](?i:listed|traded|Composite|100|futures|hits?|falls?|fell|rises?|rose|gains?|slides?|slips?|jumps?|drops?|closes?|rall(?:y|ies)|sinks?|tumbles?|surges?|soars?|link|correlation|debut|IPO|vote|treasury|merger)\\b| ?: ?\\$?[A-Z])|\\bNasdaq (?:Stockholm|Crypto|Calypso|Stock Market)\\b"
        requires: "^(?![\\s\\S]*(?:\\bIPO\\b|\\bdebut|first day of trading|record Nasdaq|tech-heavy|S&P 500|\\bDow\\b))[\\s\\S]*(?:crypto(?!graph)|\\w+coins?\\b|tokeni[sz]|\\btokens?\\b|blockchain|digital assets?|on-?chain|stablecoin|\\bether(?:eum)?\\b|solana|\\bXRP\\b|cardano|chainlink|(?-i:\\b(?:BTC|ETH|SOL|HYPE)\\b)|가상자산|코인)"

  - id: ice_nyse
    kind: institution
    label: ICE / NYSE
    category: exchange_broker
    match:
      # ICE and NYSE (incl. NYSE Arca) with crypto context; not the "(NYSE: XXX)", "(NYSE American: XXX)" or "NYSE-listed" tag of another company.
      - pattern: "Intercontinental Exchange|\\bNYSE\\b(?![- ](?i:listed|traded)\\b| ?(?:American|Arca)? ?: ?\\$?[A-Z])"
        requires: *crypto_exchange
      # ICE's stakes in crypto firms (Bakkt, OKX, Polymarket); bare "ICE" only with Bakkt or OKX, since Polymarket also lists bets on the immigration agency ICE.
      - pattern: "Intercontinental Exchange|NYSE (?:parent|owner)"
        requires: "Polymarket|Bakkt|\\bOKX\\b"
      - pattern: "\\bICE\\b"
        requires: "Bakkt|\\bOKX\\b"

  - id: cme
    kind: institution
    label: CME Group
    category: exchange_broker
    match:
      # CME Group or CME with crypto context; not the CME FedWatch tool or "CME gap" chart talk, and not continuing medical education or coronal mass ejections.
      - pattern: "\\bCME\\b(?! (?i:FedWatch|(?:futures )?gaps?)\\b)"
        requires: *crypto_exchange

  - id: broadridge
    kind: institution
    label: Broadridge
    category: market_infrastructure
    match:
      - pattern: "Broadridge"
        requires: *fin

  - id: hsbc
    kind: institution
    label: HSBC
    category: bank
    match:
      # HSBC in crypto context.
      - pattern: "\\bHSBC\\b"
        requires: *crypto_bank

  - id: fidelity
    kind: institution
    label: Fidelity
    category: asset_manager
    match:
      # Its stablecoin, Fidelity Digital Dollar (FIDD).
      - pattern: "\\bFIDD\\b"
      # Fund tickers FBTC/FETH with Fidelity or ETF words (Function's wrapped-bitcoin token is also "FBTC").
      - pattern: "\\bF(?:BTC|ETH)\\b"
        requires: "Fidelity|\\bET[FP]s?\\b|Wise Origin"
      # "Fidelity" (Investments, International, Digital Assets) with crypto words; not Fidelity National (FIS, FNF), Fidelity Bank or High Fidelity, a VR firm that ran its own blockchain currency.
      - pattern: "(?<![Hh]igh )(?<![Hh]igh-)(?<!Hi-)\\bFidelity\\b(?! National| Bank| & Guaranty)"
        requires: *crypto_asset

  # --- institutions added 2026-10-01 (owner's request: ETF issuers, exchanges, payments, banks) ---
  # Each rule fires only on crypto news about the institution; cases in tests/test_entities_institutions.py.

  # asset managers and ETF issuers
  - id: grayscale
    kind: institution
    label: Grayscale
    category: asset_manager
    match:
      # Full name and trust tickers: Bitcoin Trust (GBTC), Ethereum Trust (ETHE), Digital Large Cap Fund (GDLC).
      - pattern: "Grayscale Investments|\\b(?:GBTC|ETHE|GDLC)\\b"
      # "Grayscale" (capitalised) with crypto words; not the colour filter ("Grayscale on iPhone").
      - pattern: "\\bGrayscale\\b"
        requires: *crypto_asset
      # ... or with fund and listing words ("Grayscale Files S-1 to Convert AAVE Trust", "Grayscale Files for an IPO").
      - pattern: "\\bGrayscale\\b"
        requires: "\\bET[FPN]s?\\b|exchange-traded|(?-i:\\bTrusts?\\b)|\\bS-[13]\\b|19b-4|\\bIPO\\b|NYSE|Nasdaq|in-?flows?|out-?flows?"

  - id: bitwise
    kind: institution
    label: Bitwise
    category: asset_manager
    match:
      # Full names and the Bitwise Bitcoin ETF ticker (BITB).
      - pattern: "Bitwise (?:Asset Management|Invest(?:ments)?)\\b|\\bBITB\\b"
      # "Bitwise"/"BitWise" with crypto words; not Bitwise Industries (the Fresno tech firm whose founders were jailed for fraud) or bitwise operators.
      - pattern: "\\bBit[Ww]ise\\b(?! Industries| (?:[Oo]perat|[Ss]hift|AND\\b|OR\\b|XOR\\b|NOT\\b))"
        requires: *crypto_asset
      # ... or with fund words ("Bitwise Files S-1 For SUI ETF").
      - pattern: "\\bBit[Ww]ise\\b(?! Industries| (?:[Oo]perat|[Ss]hift|AND\\b|OR\\b|XOR\\b|NOT\\b))"
        requires: "\\bET[FPN]s?\\b|exchange-traded|\\bindex fund|\\bS-1\\b|asset manag|in-?flows?|out-?flows?"

  - id: 21shares
    kind: institution
    label: 21Shares
    category: asset_manager
    match:
      # The crypto ETP issuer, also written "21shares"; "21 shares" with a space is a share count.
      - pattern: "\\b21shares\\b"
        ignore_case: true

  - id: vaneck
    kind: institution
    label: VanEck
    category: asset_manager
    match:
      # Its tokenized Treasury fund (VBILL).
      - pattern: "\\bVBILL\\b"
      # VanEck (or "Van Eck") with crypto words, including its HODL bitcoin ETF; its gold, chip, China and meme-stock ETFs do not count.
      - pattern: "\\bVan ?Eck\\b"
        requires: *crypto_asset

  - id: invesco
    kind: institution
    label: Invesco
    category: asset_manager
    match:
      # Invesco Galaxy, its crypto ETF line with Galaxy Digital, and those tickers (BTCO, QETH, QSOL).
      - pattern: "Invesco Galaxy|\\b(?:BTCO|QETH|QSOL)\\b"
      # Invesco with crypto words; not "Invesco QQQ" in QQQ-versus-bitcoin comparisons.
      - pattern: "\\bInvesco\\b(?! QQQ)"
        requires: *crypto_asset

  - id: wisdomtree
    kind: institution
    label: WisdomTree
    category: asset_manager
    match:
      # Its tokenized-fund platforms and the WisdomTree Bitcoin Fund ticker (BTCW).
      - pattern: "WisdomTree (?:Prime|Connect|Onchain)|\\bBTCW\\b"
      # WisdomTree (or "Wisdom Tree") with crypto words; its dividend, UCITS and proxy-fight news does not count.
      - pattern: "\\bWisdom ?Tree\\b"
        requires: *crypto_asset

  - id: ark_invest
    kind: institution
    label: ARK Invest
    category: asset_manager
    match:
      # ARK 21Shares funds ("Ark and 21Shares" too) and the ARK 21Shares Bitcoin ETF ticker (ARKB).
      - pattern: "\\bA(?:RK|rk) (?:(?:and|&) )?21Shares|\\bARKB\\b"
      # ARK Invest, Cathie Wood or ARK fund tickers with crypto words (buying Coinbase counts); not Noah's Ark, Ark Labs (a bitcoin layer 2) or her Tesla trades.
      - pattern: "\\bA(?:RK|rk) Invest(?:ment)?\\b|\\bCath(?:ie|y) Woods?\\b|\\bARK[KWFQ]\\b"
        requires: *crypto_asset

  - id: coinshares
    kind: institution
    label: CoinShares
    category: asset_manager
    match:
      # The crypto asset manager (also "Coinshares", CoinShares Valkyrie); not "Coinbase shares" or "COIN shares".
      - pattern: "\\bCoin[Ss]hares\\b"

  - id: canary_capital
    kind: institution
    label: Canary Capital
    category: asset_manager
    match:
      - pattern: "Canary Capital"
      # "Canary" with crypto words ("Canary's XRP ETF"); not "canary in the coal mine", Kusama's "canary network", the Canary Islands, Canary Wharf or Canary tokens.
      - pattern: "\\bCanary\\b(?! (?i:in|islands?|wharf|network|tokens?)\\b)"
        requires: *crypto_asset

  - id: hashdex
    kind: institution
    label: Hashdex
    category: asset_manager
    match:
      # The crypto index-fund manager (also "HashDex") and its Nasdaq crypto index ETF ticker (NCIQ); not HashKey or Hashnote.
      - pattern: "\\bHashdex\\b|\\bNCIQ\\b"
        ignore_case: true

  # exchanges and brokers
  - id: coinbase
    kind: institution
    label: Coinbase
    category: exchange_broker
    match:
      # The company and its units (Prime, Custody, Derivatives, 코인베이스) on the name alone, except "Coinbase (Global Inc.) CEO/founder" as a person's title: personal news of its CEO needs rule 2.
      - pattern: "\\b(?:Coinbase|COINBASE)\\b(?!(?: Global)?(?:,? Inc\\.?)?(?: \\((?i:nasdaq): ?COIN\\))?(?:['’]s)? (?:CEO|co-?founder|founder|chief)\\b)|코인베이스"
      # Any mention with crypto context ("Coinbase CEO says bitcoin ...").
      - pattern: "\\b(?:Coinbase|COINBASE)\\b"
        requires: *crypto_exchange

  - id: robinhood
    kind: institution
    label: Robinhood
    category: exchange_broker
    match:
      # Its crypto units and chain.
      - pattern: "\\bRobinhood (?:Crypto|Chain|Wallet)\\b"
      # One word (not the folk hero, films or charity "Robin Hood") with crypto context; most Robinhood news is stocks, cards or prediction markets.
      - pattern: "\\b(?:Robinhood|ROBINHOOD)\\b"
        requires: *crypto_exchange

  - id: kraken
    kind: institution
    label: Kraken (Payward)
    category: exchange_broker
    match:
      # The parent Payward and units that only mean the exchange.
      - pattern: "\\bPayward\\b|\\bKraken (?:Financial|Pro|Futures|Exchange|Wallet)\\b"
      # Listing notices that name only the token ("Kraken Lists LINK, OMG and BAT", "WBT is available for trading on Kraken"); not "Lists Kraken Goaltender" or "List Of Kraken Players".
      - pattern: "\\bKraken (?:[Ll]ists|[Dd]elists|[Dd]elisting|[Ll]isting)\\b|\\b(?:trading|[Ll]isted|[Ll]ists?) on Kraken\\b"
      # The name with crypto context, except where it is another Kraken (Seattle Kraken, Kraken Robotics, Octopus Energy's Kraken Technologies, Kraken2, "release the Kraken").
      - pattern: "(?<!Seattle )(?<![Rr]elease the )\\b(?:Kraken|KRAKEN)\\b(?! Robotics| Technologies|2|-like)"
        requires: *crypto_exchange
      # The name with its bank regulators or Fed account ("Did the Federal Reserve really release the Kraken?").
      - pattern: "\\bKraken\\b"
        requires: "master account|Federal Reserve|(?-i:\\b(?:Fed|SEC|CFTC|OCC)\\b)"

  - id: gemini
    kind: institution
    label: Gemini
    category: exchange_broker
    match:
      # Names only the exchange uses: Gemini Space Station (Nasdaq: GEMI), Gemini Trust, Gemini Dollar (GUSD), Gemini Earn.
      - pattern: "Gemini (?:Space Station|Trust|Dollar|Earn)\\b|\\bGEMI\\b|\\bGUSD\\b"
      # "Gemini" with the Winklevoss twins, crypto words or its regulators; not Google's Gemini AI (or a model name such as "Gemini 3.6 Flash"), the zodiac sign or NASA's Project Gemini.
      - pattern: "\\bGemini\\b(?! (?:\\d|Pro|Ultra|Flash|Nano|Advanced|Live|Enterprise|API|app|model)\\b)"
        requires: "^(?![\\s\\S]*(?:Google|DeepMind|\\bAI\\b|ChatGPT|chatbot|\\bLLM|horoscope|zodiac|tarot|NASA|astronaut|Project Gemini))[\\s\\S]*(?:Winklevoss|crypto(?!graph)|\\w+coins?\\b|\\btokens?\\b|tokeni[sz]|staking|\\bether(?:eum)?\\b|solana|\\bXRP\\b|\\bperps?\\b|(?-i:\\b(?:CFTC|SEC|NYDFS)\\b))"

