# Entities matched against item titles and excerpts.
#
# kind: institution | project | theme
#   institution + project in the same item  -> "high" alert (connection candidate)
#   project in an institution/regulator feed -> "medium" alert
#   theme only                               -> stored for later search, no event
# match: a list of rules. A rule matches when `pattern` is found and, if given,
#   `requires` is also found (context words, case-insensitive).
#   Patterns are case-sensitive unless ignore_case: true.
# tokens: token symbols linked to a project (docs/institution-map.md).
# control: true for the same-narrative control group (docs/open-questions.md Q7).
#
# Matching only proposes candidates. Connection grades and business stages are
# decided by review (docs/research-principles.md sections 2 and 4).

x-context:
  finance: &fin "tokeni[sz]|blockchain|crypto|digital asset|stablecoin|on-?chain|ledger|\\bDLT\\b|deposit token|settlement"
  payments: &pay "bank|payment|ledger|blockchain|Sibos|tokeni[sz]|messag|interbank|cross-border|ISO 20022|stablecoin|settlement"

entities:
  # --- institutions in docs/institution-map.md --------------------------------
  - id: tch
    kind: institution
    label: The Clearing House
    match:
      - pattern: "The Clearing House"
      - pattern: "\\bTCH\\b"
        requires: "payment|bank|clearing|on-?chain|tokeni[sz]|\\bRTP\\b|CHIPS"

  - id: dtcc
    kind: institution
    label: DTCC
    match:
      - pattern: "\\bDTCC\\b|Fund/?SERV|Depository Trust"

  - id: swift
    kind: institution
    label: Swift
    match:
      - pattern: "\\bSWIFT\\b|(?<!Taylor )\\bSwift\\b"
        requires: *pay

  - id: us_bank
    kind: institution
    label: U.S. Bank
    match:
      - pattern: "U\\.S\\. Bank\\b|U\\.S\\. Bancorp|US Bancorp|\\bUSBDC\\b"

  - id: bvnk
    kind: institution
    label: BVNK
    match:
      - pattern: "\\bBVNK\\b"

  - id: bybit
    kind: institution
    label: Bybit
    match:
      - pattern: "\\bBybit\\b"

  - id: franklin_templeton
    kind: institution
    label: Franklin Templeton
    match:
      - pattern: "Franklin Templeton"
      - pattern: "\\bBenji\\b"
        requires: "Franklin|fund|tokeni[sz]"

  - id: lfdt
    kind: institution
    label: LF Decentralized Trust
    match:
      - pattern: "LF Decentralized Trust|Linux Foundation Decentralized Trust|\\bLFDT\\b"

  - id: ibm
    kind: institution
    label: IBM
    match:
      - pattern: "\\bIBM\\b"
        requires: "Hedera|Hashgraph|IDTrust|blockchain|tokeni[sz]|ledger"

  - id: boe
    kind: institution
    label: Bank of England
    match:
      - pattern: "Bank of England"
        requires: "stablecoin|tokeni[sz]|blockchain|\\bDLT\\b|Synchroni[sz]|digital pound|RTGS|ledger"

  # --- other institutions (discovery, docs/research-principles.md section 1) --
  - id: jpmorgan
    kind: institution
    label: JPMorgan
    match:
      - pattern: "J\\.?P\\. ?Morgan|JPMorgan|Kinexys"
        requires: *fin

  - id: citi
    kind: institution
    label: Citi
    match:
      - pattern: "\\bCiti(?:group|bank)?\\b"
        requires: *fin

  - id: bny
    kind: institution
    label: BNY
    match:
      - pattern: "\\bBNY\\b|BNY Mellon"
        requires: *fin

  - id: state_street
    kind: institution
    label: State Street
    match:
      - pattern: "State Street"
        requires: *fin

  - id: blackrock
    kind: institution
    label: BlackRock
    match:
      - pattern: "BlackRock|\\bBUIDL\\b"
        requires: *fin

  - id: goldman
    kind: institution
    label: Goldman Sachs
    match:
      - pattern: "Goldman Sachs"
        requires: *fin

  - id: visa
    kind: institution
    label: Visa
    match:
      - pattern: "\\bVisa\\b"
        requires: *fin

  - id: mastercard
    kind: institution
    label: Mastercard
    match:
      - pattern: "Mastercard"
        requires: *fin

  - id: euroclear
    kind: institution
    label: Euroclear
    match:
      - pattern: "Euroclear|Clearstream"

  - id: nasdaq
    kind: institution
    label: Nasdaq
    match:
      - pattern: "\\bNasdaq\\b"
        requires: "tokeni[sz]|blockchain|digital asset|on-?chain|DLT"

  - id: ice_nyse
    kind: institution
    label: ICE / NYSE
    match:
      - pattern: "Intercontinental Exchange|\\bNYSE\\b"
        requires: "tokeni[sz]|blockchain|digital asset|on-?chain|DLT"

  - id: cme
    kind: institution
    label: CME Group
    match:
      - pattern: "CME Group"
        requires: *fin

  - id: broadridge
    kind: institution
    label: Broadridge
    match:
      - pattern: "Broadridge"
        requires: *fin

  - id: hsbc
    kind: institution
    label: HSBC
    match:
      - pattern: "\\bHSBC\\b"
        requires: *fin

  - id: fidelity
    kind: institution
    label: Fidelity
    match:
      - pattern: "\\bFidelity\\b"
        requires: *fin

  # --- projects (watch sample and control, docs/open-questions.md Q7) ---------
  - id: quant
    kind: project
    label: Quant
    tokens: [QNT]
    match:
      - pattern: "Quant Network|Overledger|\\bQNT\\b"
      - pattern: "\\bQuant\\b"
        requires: "tokeni[sz]|blockchain|ledger|on-?chain|interoperab|Clearing House|stablecoin|deposit|Overledger"

  - id: chainlink
    kind: project
    label: Chainlink
    tokens: [LINK]
    match:
      # "Chainlink" is also the chain-link fence ("Chainlink Fence", "vinyl-coated
      # Chainlink", "Chainlink Mesh", "Chainlink Segments"). The fence words right
      # after the name are skipped, the whole rule is skipped when the text uses
      # fence-trade vocabulary, and the text must use crypto or oracle vocabulary
      # (real Chainlink news does; fence-market reports do not). Bare "fence" is
      # not used: "on the fence" and "ring-fenced" appear in finance news, and
      # "defence industry" or "ring(-)fence company" are not fence-trade words
      # either. ChainLink Research (supply-chain analysts), ChainLink Solutions
      # (freight broker) and Chainlink Services LLC (a fence contractor) are other
      # firms. "Chainlinked" is not the name.
      - pattern: "\\b(?:Chainlink|CHAINLINK)\\b(?! (?:Research|RESEARCH|Solutions|SOLUTIONS)\\b| Services,? (?:LLC|LP|Inc))(?![- ]?(?:[Ff]enc|FENC|[Mm]esh|MESH))|\\bLINK [Tt]okens?\\b|\\b(?:KRW|USDT?|BTC)-LINK\\b|\\bLINK[-/](?:USD[TC]?|KRW|BTC|ETH|EUR)\\b"
        requires: "^(?![\\s\\S]*(?:barbed[- ]wire|vinyl[- ]coated|galvani[sz]ed (?:steel|wire|mesh|fabric|pipe|posts?)|wire mesh|privacy slats?|(?<![A-Za-z-])(?<!ring )fenc(?:e|ing)[- ]?(?:posts?|panels?|fabric|gates?|compan(?:y|ies)|contractors?|installers?|makers?|manufacturers?|industry|materials?|suppl(?:y|ies)|products?)\\b))(?=[\\s\\S]*(?:blockchain|crypto|tokeni[sz]|\\btokens?\\b|oracles?|(?-i:\\bLINK\\b)|\\bCCIP\\b|\\bDeFi\\b|on-?chain|cross-?chain|smart contracts?|stablecoin|digital assets?|(?-i:\\bSwift\\b|\\bSWIFT\\b)|staking|\\bET[FP]s?\\b|Chainlink Labs|Nazarov|Proof of Reserve|AppChain|Runtime Environment|node operators?|interoperab|public chains?|\\bWeb3\\b|\\bCBDC\\b|e-HKD|Sibos|\\bDTCC\\b))"
      # The 2017-2019 spelling "ChainLink" is a natural name for supply-chain
      # and logistics firms, so it needs project-specific context. "Oracle" (the
      # software company) does not count; "blockchain", "crypto" and
      # "stablecoin" do not either, because those firms use them too.
      - pattern: "\\bChainLink\\b(?! (?:Research|RESEARCH|Solutions|SOLUTIONS)\\b| Services,? (?:LLC|LP|Inc))(?![- ]?(?:[Ff]enc|FENC))"
        requires: "(?-i:\\b[Oo]racles\\b|\\boracle\\b|\\bLINK\\b)|oracle (?:network|service|node)s?|decentrali[sz]ed oracle|on-?chain|smart contracts?|\\bDeFi\\b|Nazarov|SmartContract|\\bCCIP\\b|\\bCBDC\\b|e-HKD|digital assets?"
      # Ticker lists. DOGE (the US agency), LTC (long-term care), SOL and ETH
      # (ETH Zurich) are common acronyms, and LINK is also the UK ATM network
      # and the Illinois SNAP card, so crypto context is required.
      - pattern: "\\b(?:BTC|ETH|XRP|SOL|XLM|HBAR|AVAX|DOGE|LTC)(?:,| and| or| &) LINK\\b|\\bLINK(?:,| and| or| &) (?:BTC|ETH|XRP|SOL|XLM|HBAR|AVAX|DOGE|LTC)\\b(?! Z[uü]rich)"
        requires: "altcoin|crypto|bitcoin|\\bether\\b|ethereum|blockchain|\\bDeFi\\b|on-?chain|\\btokens?\\b|\\bcoins?\\b|memecoin|\\bETFs?\\b|\\bETPs?\\b|Upbit|Coinbase|Binance|Kraken|Bithumb"
      # Interlink Electronics (Nasdaq: LINK) and LINK Mobility (Oslo: LINK.OL)
      # share the cashtag, and stock sites also write about "whales".
      - pattern: "(?<!Electronics \\()(?<!Interlink \\()\\$LINK\\b(?!\\.[A-Za-z])"
        requires: "^(?![\\s\\S]*(?-i:\\bInterlink\\b|LINK Mobility))(?=[\\s\\S]*(?:altcoin|\\bDeFi\\b|on-?chain|staking|\\bwhales?\\b|oracle network|decentrali[sz]ed oracle))"
      # CCIP is also a Medicare programme and CCI Paris; ENS uses "CCIP-Read"
      # (EIP-3668), "CCIP-Write" (EIP-5559) and "CCIP gateways" for
      # cross-chain name lookups.
      - pattern: "\\bCCIP\\b(?![- ]Read)"
        requires: "^(?![\\s\\S]*(?:CCIP[- ]?(?:read|write)|EIP-?3668|EIP-?5559|(?-i:\\bENS\\b)))(?=[\\s\\S]*cross-?chain)"

  - id: ondo
    kind: project
    label: Ondo Finance
    tokens: [ONDO]
    match:
      - pattern: "Ondo Finance|\\bOndo\\b|\\bONDO\\b|Oasis Pro"

  - id: stellar
    kind: project
    label: Stellar
    tokens: [XLM]
    match:
      # Full names of the foundation, the token, the protocol, the network and
      # its developer products, and the Upbit Korean name 스텔라루멘. "Stellar
      # Lumen" (singular, Title Case) is left to the ticker rule: "Stellar Lumen
      # Quarter" is Lumen Technologies. "Stellar Blockchain Stocks/ETF" and
      # "Stellar network reliability" are adjective uses.
      - pattern: "Stellar Development Foundation|STELLAR (?:DEVELOPMENT FOUNDATION|LUMENS)\\b|Stellar (?:Lumens|lumens?)\\b|스텔라 ?루멘|Stellar Consensus Protocol|Stellar Disbursement Platform|Stellar Aid Assist|Stellar Community Fund|Stellar (?:Anchor Platform|Wallets Kit|Asset Contracts?|Asset Sandbox)\\b"
      # Network and blockchain names, unless the text names another Stellar
      # company ("Stellar Cyber ... Stellar network sensors", "Stellar Health
      # grows the Stellar network"). In Title Case "Stellar Blockchain" counts
      # only when no capitalised word follows and no article or possessive comes
      # before ("a Stellar Blockchain Team", "JPMorgan's Stellar Blockchain
      # Unit" are the adjective).
      - pattern: "(?<!\\b[Aa] )(?<!\\b[Aa]n )(?<!['’]s )Stellar (?:[Pp]ublic )?Blockchain\\b(?! [A-Z])|Stellar (?:[Pp]ublic )?blockchain\\b(?! (?:[Ss]tocks?|ETFs?|[Rr]evenues?|[Rr]eturns?|[Gg]rowth|[Rr]ally|[Gg]ains|[Ee]arnings|[Yy]ear|[Qq]uarter|[Ss]ector|[Ii]ndex|[Tt]eam|[Uu]nit)\\b)|(?:Stellar (?:network|mainnet|testnet)|[Tt]he Stellar (?:Network|Mainnet))\\b(?! (?:[Ee]ffects?|[Gg]rowth|[Pp]erformance|[Rr]eliability|[Qq]uality|[Cc]overage|[Uu]ptime|[Ss]peeds?|of)\\b)"
        requires: "^(?![\\s\\S]*(?-i:Stellar (?:Cyber|Bancorp|Bank|Health|Blade|Recovery|Data Recovery|Capital|Energy|Industries|Wind|Partners(?! [Ww]ith\\b)|Foundation for the Arts)\\b))"
      # Ticker. Not Excel 4.0 (XLM) macros, the XLM-R/XLM-V language models or
      # XLMedia (AIM: XLM, XLM.L); the whole rule is skipped when the text is
      # about Excel 4.0 macros, language models or XLMedia.
      - pattern: "(?<!Excel )(?<!4\\.0 \\()(?<!macros \\()(?<!macro \\()(?<!AIM: )(?<!LON: )(?<!AIM:)(?<!LON:)\\bXLM\\b(?!-R|-[A-Z]\\b|-\\d|\\.L\\b|/XL4\\b| 4\\.0|\\)? ?[Mm]acros?\\b| [Mm]odels?\\b)"
        requires: "^(?![\\s\\S]*(?:Excel 4\\.0|Excel macro|\\bXL4\\b|macro sheets?|XLMedia|\\bmBERT\\b|RoBERTa|multilingual|cross-?lingual|language models?))(?=[\\s\\S]*(?:Stellar|lumens|crypto|token|coin|digital asset|blockchain|on-?chain|stablecoin|\\bET[FP]s?\\b|exchange-traded|futures|Grayscale|price|trading|listing|KRW-XLM|XLM[-/](?:USDT?|USDC|KRW|BTC|EUR)\\b|Upbit|Bithumb|Binance|Kraken|스텔라|루멘|가상자산|암호화폐|가상화폐|업비트|빗썸|코인))"
      # Bare "Stellar" only where it reads as a name, never as the adjective
      # ("Posts Stellar Results", "Was Stellar for", "Nothing Short of
      # Stellar", "Less Than Stellar") or as another company. When the text
      # names Stellar Cyber, Bancorp/Bank, Health, Blade, Recovery, Capital,
      # Energy, Industries, Wind, Partners (the firm, not "Partners With") or the
      # Foundation for the Arts, bare "Stellar" is that company ("Stellar's Open
      # XDR", "Stellar customers", (“Stellar”)), so these rules are skipped. The
      # pipeline joins title and excerpt with a space, so an excerpt that starts
      # with "Stellar" follows the last word of the title.
      # (a) possessive or compound: "Stellar's", "Stellar-based".
      - pattern: "\\bStellar(?:['’]s|-(?:based|native|issued|powered|listed))\\b"
        requires: &stellar_ctx "^(?![\\s\\S]*(?-i:Stellar (?:Cyber|Bancorp|Bank|Health|Blade|Recovery|Data Recovery|Capital|Energy|Industries|Wind|Partners(?! [Ww]ith\\b)|Foundation for the Arts)\\b))(?=[\\s\\S]*(?:blockchain|crypto|digital (?:asset|dollar|currenc)|stablecoin|USDC|EURC|PYUSD|tokeni[sz]|on-?chain|\\bDLT\\b|distributed ledger|smart contract|mainnet|\\bXLM\\b|Soroban|\\bSDF\\b|Denelle Dixon|DeFi|real-world asset|\\bRWA\\b|\\bCBDC\\b|hryvnia))"
      # (b1) before "(" or a lowercase verb or product noun ("Stellar (XLM)",
      # "Stellar said", "Stellar partners with", "Stellar mainnet"). Title Case
      # adjectives take capitalised words, so lowercase ones are safe; result
      # nouns after "protocol"/"futures" still count as the adjective ("Stellar
      # futures volume lifts CME").
      - pattern: "(?<!Be |Is |So |be |is |so )(?<!Are |Log |Was |are |log |was )(?<!Been |Book |Logs |Look |Post |Seem |Stay |Were |been |book |logs |look |post |seem |stay |were )(?<!Books |Enjoy |Flows |Gains |Looks |Notch |Posts |Prove |Quite |Sales |Seems |Stays |Still |Truly |books |enjoy |flows |gains |looks |notch |posts |prove |quite |sales |seems |stays |still |truly )(?<!Demand |Enjoys |Growth |Looked |Pretty |Proved |Proven |Proves |Remain |Report |Seemed |Simply |Stayed |demand |enjoys |growth |looked |pretty |proved |proven |proves |remain |report |seemed |simply |stayed )(?<!Deliver |Good to |Revenue |revenue |Inflows |Notches |Records |Remains |Reports |Results |Returns |Volumes |deliver |good to |inflows |notches |records |remains |reports |results |returns |volumes )(?<!Delivers |Earnings |Great to |Remained |Short of |Solid to |delivers |earnings |great to |remained |short of |solid to )(?<!Sued |Sues )(?<!Charged |Charges )(?!(?<=\\b[Aa] )Stellar(?:[,.:;!?]| and\\b| or\\b| [-–—]| Foundation\\b))\\bStellar(?= \\(| (?:is|has|will|was|said|says|today|now|also|mainnet|testnet|ledger|chain|anchors?|partners with|launches|joins|integrates|announces|adds|expands|unveils|introduces|debuts|selects|becomes|supports)\\b| (?:protocol|ecosystem)\\b(?! (?:of|for)\\b)(?! (?:[Vv]olumes?|[Rr]evenues?|[Gg]rowth|[Tt]rading|[Dd]emand|[Aa]ctivity|[Ff]ees|[Ii]nflows|[Ff]lows|[Bb]usiness|[Ss]ales|[Rr]esults|[Rr]eturns?|[Gg]ains|[Pp]erformance|[Nn]umbers|[Ff]igures|[Ee]arnings|[Pp]rofits?|TVL|[Oo]pen [Ii]nterest|[Mm]omentum|[Uu]ptake)\\b)| (?:cryptocurrency |crypto )?futures\\b(?! (?:[Vv]olumes?|[Rr]evenues?|[Gg]rowth|[Tt]rading|[Dd]emand|[Aa]ctivity|[Ff]ees|[Ii]nflows|[Ff]lows|[Bb]usiness|[Ss]ales|[Rr]esults|[Rr]eturns?|[Gg]ains|[Pp]erformance|[Nn]umbers|[Ff]igures|[Ee]arnings|[Pp]rofits?|TVL|[Oo]pen [Ii]nterest|[Mm]omentum|[Uu]ptake)\\b))"
        requires: *stellar_ctx
      # (b1) Title Case verbs and product nouns ("Stellar Launches", "Stellar
      # Partners With", "Stellar Surges 12%", "Stellar Futures", "Stellar ETF")
      # take the attributive adjective too ("Sees Stellar Crypto Futures
      # Volume", "Two Stellar Launches:", "Builds Stellar Ecosystem of"), so they
      # count only in subject position: at the start, after punctuation or after
      # "and"/"&". Result nouns after a product noun, "of"/"for" after
      # Network/Ecosystem/Foundation/Protocol, and a price verb not followed by a
      # figure or a preposition ("Stellar Rallies Lift Crypto Stocks") are skipped.
      # "Stellar Hits and Misses" and "Stellar Launches Lift ..." are the noun.
      - pattern: "(?:^|(?<=[:;,.?!] )|(?<=\\b[Aa]nd )|(?<=& ))Stellar(?= (?:(?:Launches|Joins|Integrates|Announces|Adds|Expands|Unveils|Introduces|Debuts|Taps|Selects|Enters|Surpasses|Tops|Reaches|Crosses|Named|Powers|Enables|Onboards|Brings|Welcomes|Is(?! the [Ww]ord\\b)|Hits(?! (?:and|&) Misses\\b))\\b(?!:)(?<!Launches(?= (?:Lift|Drive|Boost|Fuel|Help|Spark|Power|Push|Lead|Give|Show|Make|Mark|Signal)\\b))(?<!Debuts(?= (?:Lift|Drive|Boost|Fuel|Help|Spark|Power|Push|Lead|Give|Show|Make|Mark|Signal)\\b))|Moves (?:Into|Toward|To|Onto|Beyond)\\b|Partners? (?:[Ww]ith|[Oo]n|[Tt]o)\\b(?! (?:[Ff]raud|[Ss]ecurities|[Vv]iolat|[Mm]islead|[Dd]efraud|[Rr]unning|[Oo]perating|[Ss]elling|[Oo]ffering|[Ii]nsider|[Ss]teal|[Mm]isappropriat))|Teams [Uu]p\\b|Goes [Ll]ive\\b|Price (?:(?:Surges|Rallies|Jumps|Slides|Falls|Climbs|Soars|Rises|Drops|Dips|Tumbles|Slumps|Rebounds|Spikes|Plunges|Sinks)\\b(?= (?:\\d|\\$|(?i:after|as|on|to|above|below|past|amid|over|in|while|despite|from|toward|towards|near|ahead|with|by|since|back)\\b)|[,.;:!?]?\\s*$)|(?:Prediction|Analysis|Forecast|Today)\\b)|(?:Surges|Rallies|Jumps|Slides|Falls|Climbs|Soars|Rises|Drops|Dips|Tumbles|Slumps|Rebounds|Spikes|Plunges|Sinks)\\b(?= (?:\\d|\\$|(?i:after|as|on|to|above|below|past|amid|over|in|while|despite|from|toward|towards|near|ahead|with|by|since|back)\\b)|[,.;:!?]?\\s*$)|(?:[Cc]ryptocurrency |[Cc]rypto )?Futures\\b(?! (?:[Vv]olumes?|[Rr]evenues?|[Gg]rowth|[Tt]rading|[Dd]emand|[Aa]ctivity|[Ff]ees|[Ii]nflows|[Ff]lows|[Bb]usiness|[Ss]ales|[Rr]esults|[Rr]eturns?|[Gg]ains|[Pp]erformance|[Nn]umbers|[Ff]igures|[Ee]arnings|[Pp]rofits?|TVL|[Oo]pen [Ii]nterest|[Mm]omentum|[Uu]ptake)\\b)|(?:Protocol|Ecosystem)\\b(?! (?:of|for)\\b)(?! (?:[Vv]olumes?|[Rr]evenues?|[Gg]rowth|[Tt]rading|[Dd]emand|[Aa]ctivity|[Ff]ees|[Ii]nflows|[Ff]lows|[Bb]usiness|[Ss]ales|[Rr]esults|[Rr]eturns?|[Gg]ains|[Pp]erformance|[Nn]umbers|[Ff]igures|[Ee]arnings|[Pp]rofits?|TVL|[Oo]pen [Ii]nterest|[Mm]omentum|[Uu]ptake)\\b)|Network\\b(?! (?:[Ee]ffects?|[Gg]rowth|[Pp]erformance|[Rr]eliability|[Qq]uality|[Cc]overage|[Uu]ptime|[Ss]peeds?|of|for)\\b)|Foundation\\b(?! (?:for|of|[Ll]aid|[Ss]et|[Bb]uilt)\\b)|ET[FP]s?\\b(?! (?:[Ii]nflows|[Ff]lows|[Dd]emand|[Dd]ebut|[Rr]eturns?|[Pp]erformance|[Yy]ear|[Ss]ales|[Gg]rowth|[Vv]olumes?|[Tt]rading)\\b)|Meridian\\b|(?:DEX|USDC|EURC|PYUSD)\\b(?! (?:[Vv]olumes?|[Rr]evenues?|[Gg]rowth|[Tt]rading|[Dd]emand|[Aa]ctivity|[Ff]ees|[Ii]nflows|[Ff]lows|[Bb]usiness|[Ss]ales|[Rr]esults|[Rr]eturns?|[Gg]ains|[Pp]erformance|[Nn]umbers|[Ff]igures|[Ee]arnings|[Pp]rofits?|TVL|[Oo]pen [Ii]nterest|[Mm]omentum|[Uu]ptake)\\b)))"
        requires: "^(?![\\s\\S]*(?-i:Stellar (?:Cyber|Bancorp|Bank|Health|Blade|Recovery|Data Recovery|Capital|Energy|Industries|Wind|Partners(?! [Ww]ith\\b)|Foundation for the Arts)\\b))(?=[\\s\\S]*(?:blockchain|crypto|digital (?:asset|dollar|currenc)|stablecoin|USDC|EURC|PYUSD|tokeni[sz]|on-?chain|\\bDLT\\b|distributed ledger|smart contract|mainnet|\\bXLM\\b|Soroban|\\bSDF\\b|Denelle Dixon|DeFi|real-world asset|\\bRWA\\b|\\bCBDC\\b|hryvnia|\\bET[FP]s?\\b|Grayscale|altcoin))"
      # (b1) a fund or futures product as the object of a listing or filing verb
      # ("Files for Stellar ETF", "CME Adds Stellar Futures"), not after other
      # words ("After Stellar ETF Launch").
