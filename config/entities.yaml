  # --- coverage: CoinGecko market-cap ranks 11-20 ----------------------------
  # CoinGecko /coins/markets snapshot at 2026-09-30 22:56 KST; the rank table
  # is kept in the dated research/ record, not here. Left out by the owner's
  # rules: stablecoins, wrapped and staking tokens, gold-linked tokens and LEO.
  # Exchange tokens (WBT) are kept. Chainlink and Stellar, which fall in this
  # range, are the entries above. This list is coverage, not the interest
  # sample or the control group of docs/open-questions.md Q7, so none of these
  # is marked control.
  # Test headlines: tests/test_entities_ranks_11_20.py.
  - id: hyperliquid
    kind: project
    label: Hyperliquid
    tokens: [HYPE]
    match:
      # Full names, in Title Case or all caps. "hyperliquid" is also a finance
      # adjective ("hyperliquid Treasuries", "reserves must be hyperliquid"),
      # which looks the same in a Title Case or all-caps headline. Rule 1 skips
      # the name after a copula that follows a word ("Treasuries Are
      # Hyperliquid", whatever follows, since the excerpt comes right after the
      # title; not "What Is Hyperliquid" or "Is Hyperliquid's"), after a degree
      # or linking word ("More", "Keep", "Remain"), after a plural asset noun
      # ("Reserves Hyperliquid,"), after "by" before punctuation ("Backed by
      # Hyperliquid, High-Quality Assets"), and before an asset noun
      # ("Hyperliquid Deposits") or "Is the". The copula and "Is the" checks are
      # for Title Case and all caps only: in sentence case the adjective is
      # lowercase ("winners are Hyperliquid and Aster" is the name). Linking
      # verbs include look, seem, appear, prove and become ("Treasuries Look
      # Hyperliquid"). Rules 2 and 3 take some skipped cases back with context;
      # they never take the bond/bill nouns or "Holdings" ("Hyperliquid
      # Holdings" is ambiguous).
      # "Hyper Foundation" is not "Hyperledger Foundation".
      - pattern: "(?<!\\b(?i:be) )(?<!\\b(?i:remain) )(?<!\\b(?i:remains) )(?<!\\b(?i:stay) )(?<!\\b(?i:stays) )(?<!\\b(?i:still) )(?<!\\b(?i:very) )(?<!\\b(?i:less) )(?<!\\b(?i:more) )(?<!\\b(?i:most) )(?<!\\b(?i:so) )(?<!\\b(?i:too) )(?<!\\b(?i:highly) )(?<!\\b(?i:keep) )(?<!\\b(?i:keeps) )(?<!\\b(?i:make) )(?<!\\b(?i:makes) )(?<!\\b(?i:reserves) )(?<!\\b(?i:funds) )(?<!\\b(?i:treasuries) )(?<!\\b(?i:portfolios) )(?<!\\b(?i:deposits) )(?<!\\b(?i:securities) )(?<!\\b(?i:assets) )(?<!\\b(?i:balances) )(?<!\\b(?i:bonds) )(?<!\\b(?i:look) )(?<!\\b(?i:looks) )(?<!\\b(?i:looked) )(?<!\\b(?i:seem) )(?<!\\b(?i:seems) )(?<!\\b(?i:seemed) )(?<!\\b(?i:appear) )(?<!\\b(?i:appears) )(?<!\\b(?i:prove) )(?<!\\b(?i:proves) )(?<!\\b(?i:proved) )(?<!\\b(?i:proven) )(?<!\\b(?i:become) )(?<!\\b(?i:becomes) )(?<!\\b(?i:became) )(?!(?:(?<=\\w (?:Is|IS) )|(?<=\\w (?:Are|ARE) )|(?<=\\w (?:Was|WAS) )|(?<=\\w (?:Were|WERE) ))(?<!\\b(?i:what|when) (?:Is|IS) )(?<!\\b(?i:why|how|who) (?:Is|IS) )(?<!\\b(?i:where|which) (?:Is|IS) )(?<!\\b(?i:what|when) (?:Are|ARE) )(?<!\\b(?i:why|how|who) (?:Are|ARE) )(?<!\\b(?i:where|which) (?:Are|ARE) )(?<!\\b(?i:what|when) (?:Was|WAS) )(?<!\\b(?i:why|how|who) (?:Was|WAS) )(?<!\\b(?i:where|which) (?:Was|WAS) )(?<!\\b(?i:what|when) (?:Were|WERE) )(?<!\\b(?i:why|how|who) (?:Were|WERE) )(?<!\\b(?i:where|which) (?:Were|WERE) )(?:Hyperliquid|HYPERLIQUID)(?!['’][Ss]\\b))(?!(?<=\\b(?i:by) )(?:Hyperliquid|HYPERLIQUID)(?:[,.;:!]| (?i:and|or)\\b|\\s*$))\\b(?:Hyperliquid|HYPERLIQUID)\\b(?! (?i:treasuries|u\\.?s\\.? treasur\\w*|t-?bills?|securities|bonds?|gilts?|bunds?|sovereigns?|money|treasury(?! (?:firms?|compan(?:y|ies)|vehicles?|strateg(?:y|ies))\\b)|assets?|collateral|instruments?|reserves?|funding|government|markets?|stocks?|equit(?:y|ies)|cash|debt|credit|deposits?|portfolios?|investments?|repo|dollars?|holdings?)\\b| Is the\\b| IS THE\\b)|\\bHyperEVM\\b|\\bHyperBFT\\b|\\bHyper Foundation\\b"
      # "HyperLiquid" (camel case) is a common misspelling; it needs context too.
      # Rule 2 takes every case back with Hyperliquid-specific context: HyperEVM,
      # HyperCore, USDH, $HYPE, "HYPE token/price/ETF/...", a HYPE trading
      # pair, Hyper Foundation, Hyperliquid's. Generic words (staking, DEX, an
      # all-caps HYPE) do not count: a speech on stablecoin reserves can mention
      # ETH staking or DEX settlement.
      - pattern: "\\b(?:Hyper[Ll]iquid|HYPERLIQUID)\\b(?! (?i:treasuries|u\\.?s\\.? treasur\\w*|treasury (?:markets?|bills?|notes?|bonds?|securities|yields?)|t-?bills?|securities|bonds?|gilts?|bunds?|sovereigns?|money|holdings?)\\b)"
        requires: "HyperEVM|HyperCore|HyperBFT|\\bUSDH\\b|\\$HYPE\\b|Hyper Foundation|Hyperliquid['’]s|Hyperliquid (?:Labs|Strategies|Policy Center)|\\(HYPE\\)|\\b(?:KRW|USDT?|BTC)-HYPE\\b|\\bHYPE[/-](?:USD[CTH]?|EUR|BTC|KRW|PERP)\\b|(?-i:(?<![A-Z]{2} )(?<![Tt]he )\\bHYPE (?:[Tt]okens?|[Pp]rice|[Ss]lides?|[Ss]lips?|[Cc]limbs?|[Jj]umps?|[Ff]alls?|[Dd]rops?|[Rr]ises?|[Rr]all(?:y|ies)|[Ss]urges?|[Ss]oars?|[Tt]umbles?|[Ss]taking|[Ss]takers?|[Hh]olders?|[Hh]oldings|ETFs?|ETPs?|[Ff]utures|[Oo]ptions|[Pp]erps?|[Tt]reasury|[Bb]uybacks?)\\b)"
      # Rule 3 takes back the name before an asset noun, before "Is the" and in
      # camel case ("Hyperliquid Market Share Slips ... Perps", "Hyperliquid Is
      # the Most Profitable Crypto Venue") with derivatives-venue context, but
      # not after a copula, a degree or linking word or "by" ("Reserves Must Be
      # Hyperliquid"), where only rule 2 counts.
      - pattern: "(?<!\\b(?i:be) )(?<!\\b(?i:remain) )(?<!\\b(?i:remains) )(?<!\\b(?i:stay) )(?<!\\b(?i:stays) )(?<!\\b(?i:still) )(?<!\\b(?i:very) )(?<!\\b(?i:less) )(?<!\\b(?i:more) )(?<!\\b(?i:most) )(?<!\\b(?i:so) )(?<!\\b(?i:too) )(?<!\\b(?i:highly) )(?<!\\b(?i:keep) )(?<!\\b(?i:keeps) )(?<!\\b(?i:make) )(?<!\\b(?i:makes) )(?<!\\b(?i:reserves) )(?<!\\b(?i:funds) )(?<!\\b(?i:treasuries) )(?<!\\b(?i:portfolios) )(?<!\\b(?i:deposits) )(?<!\\b(?i:securities) )(?<!\\b(?i:assets) )(?<!\\b(?i:balances) )(?<!\\b(?i:bonds) )(?<!\\b(?i:look) )(?<!\\b(?i:looks) )(?<!\\b(?i:looked) )(?<!\\b(?i:seem) )(?<!\\b(?i:seems) )(?<!\\b(?i:seemed) )(?<!\\b(?i:appear) )(?<!\\b(?i:appears) )(?<!\\b(?i:prove) )(?<!\\b(?i:proves) )(?<!\\b(?i:proved) )(?<!\\b(?i:proven) )(?<!\\b(?i:become) )(?<!\\b(?i:becomes) )(?<!\\b(?i:became) )(?!(?:(?<=\\w (?:Is|IS) )|(?<=\\w (?:Are|ARE) )|(?<=\\w (?:Was|WAS) )|(?<=\\w (?:Were|WERE) ))(?<!\\b(?i:what|when) (?:Is|IS) )(?<!\\b(?i:why|how|who) (?:Is|IS) )(?<!\\b(?i:where|which) (?:Is|IS) )(?<!\\b(?i:what|when) (?:Are|ARE) )(?<!\\b(?i:why|how|who) (?:Are|ARE) )(?<!\\b(?i:where|which) (?:Are|ARE) )(?<!\\b(?i:what|when) (?:Was|WAS) )(?<!\\b(?i:why|how|who) (?:Was|WAS) )(?<!\\b(?i:where|which) (?:Was|WAS) )(?<!\\b(?i:what|when) (?:Were|WERE) )(?<!\\b(?i:why|how|who) (?:Were|WERE) )(?<!\\b(?i:where|which) (?:Were|WERE) )(?:Hyperliquid|HYPERLIQUID)(?!['’][Ss]\\b))(?!(?<=\\b(?i:by) )(?:Hyperliquid|HYPERLIQUID)(?:[,.;:!]| (?i:and|or)\\b|\\s*$))\\b(?:Hyper[Ll]iquid|HYPERLIQUID)\\b(?! (?i:treasuries|u\\.?s\\.? treasur\\w*|treasury (?:markets?|bills?|notes?|bonds?|securities|yields?)|t-?bills?|securities|bonds?|gilts?|bunds?|sovereigns?|money|holdings?)\\b)"
        requires: "\\bperps?\\b|perpetual (?:futures|contracts?|swaps?)|(?:spot|perp\\w*|on-?chain) order ?books?|(?:crypto|derivatives|perps?|trading|on-?chain) (?:venues?|exchanges?)|decentrali[sz]ed exchange"
      # SC//HyperCore (Scale Computing, virtualization) shares the name and its
      # releases talk about order books (backlog) and perpetual licences;
      # Holepunch's "Hypercore" differs only in case.
      - pattern: "(?<!/)\\bHyperCore\\b"
        requires: "HyperEVM|(?:spot|perp\\w*|on-?chain) order ?books?|\\bperps?\\b|\\$HYPE|\\bUSDH\\b|(?-i:(?<![-/])(?<![Cc]rypto )(?<![Dd]igital )(?<![Cc]hain )(?<!Web3 )(?<!DeFi )(?<!AI )\\bNative Markets\\b)"
      # Hubble Protocol (Solana) also issued a stablecoin called USDH. The
      # issuer name is matched case-sensitively so "crypto-native markets"
      # does not count.
      - pattern: "\\bUSDH\\b"
        requires: "(?-i:(?<![-/])(?<![Cc]rypto )(?<![Dd]igital )(?<![Cc]hain )(?<!Web3 )(?<!DeFi )(?<!AI )\\bNative Markets\\b)|HyperEVM"
      # HYPE is an English word (all-caps headlines, "Don't Believe the HYPE")
      # and the ticker of Hyper Bit Technologies (CSE / Cboe Canada: HYPE, a
      # crypto miner; cashtag $HYPE.CN), an iShares UCITS ETF on Xetra and the
      # Italian e-money firm HYPE (Banca Sella), which sells crypto. Only token
      # phrasing (in either case, "HYPE Futures") and trading pairs ("HYPE/USD",
      # "KRW-HYPE") count; an all-caps run before HYPE ("BEYOND THE HYPE TOKENS")
      # is skipped. Not in texts naming iShares, UCITS, Xetra or a high-yield
      # corporate bond fund ("iShares HYPE ETF").
      - pattern: "\\$HYPE\\b(?!\\.[A-Za-z])|(?<![A-Z]{2} )(?<!iShares )\\bHYPE (?:[Tt]okens?|[Ss]taking|[Ss]takers?|[Hh]olders?|[Hh]oldings|ETFs?|ETPs?|[Tt]reasury|[Bb]uybacks?|[Ff]utures|[Oo]ptions|[Pp]erps?)\\b|\\bHYPE[/-](?:USD[CTH]?|EUR|BTC|KRW|PERP)\\b|\\b(?:KRW|USDT?|BTC)-HYPE\\b"
        requires: "^(?![\\s\\S]*(?:\\biShares\\b|\\bUCITS\\b|\\bXetra\\b|high[- ]yield corp))"
      - pattern: "\\b(?:Grayscale|Bitwise|21Shares|VanEck|Canary)(?:'s|’s)? HYPE\\b(?! (?!ETFs?\\b|ETPs?\\b)[A-Z]{2,}\\b)"
      - pattern: "(?<![A-Z]{2} )(?<![Tt]he )(?<!:)(?<!: )\\bHYPE\\b(?! [A-Z]{2,}\\b)(?!\\))"
        requires: "Hyperion DeFi|(?-i:(?<![-/])(?<![Cc]rypto )(?<![Dd]igital )(?<![Cc]hain )(?<!Web3 )(?<!DeFi )(?<!AI )\\bNative Markets\\b)|Hyperliquid Strategies|Kinetiq"

  - id: dogecoin
    kind: project
    label: Dogecoin
    tokens: [DOGE]
    match:
      # Names that only refer to Dogecoin, even in a text that also mentions
      # the Department of Government Efficiency ("DOGE").
      - pattern: "\\bDogecoin (?:Foundation|ETFs?|ETPs?|ETNs?|exchange-traded|Trust|futures|treasur(?:y|ies)|Core)\\b"
        ignore_case: true
      # The Foundation's corporate arm (Nasdaq: HODO). Guardian/FT style writes
      # the agency as "Doge", so a "House of Doge" pun needs company context.
      - pattern: "House of Doge"
        requires: "dogecoin|\\bHODO\\b|Brag House|CleanCore|Margiotta|memecoin|meme coin|\\$DOGE"
      # The full name (and the Korean 도지코인), but not in stories about the
      # Department of Government Efficiency that explain its acronym as a nod to
      # Dogecoin (either word order, DOGE or Doge; "shares an acronym with",
      # "lifted from"), and not Baby Doge Coin, wrapped or pegged DOGE, rivals
      # and look-alikes ("Dogecoin killer", "dogecoin rivals", "a Dogecoin
      # copycat", "Dogecoin clones", "Dogecoin-like memecoins") or the Doge
      # meme, mascot or Kabosu. Naming the agency alone does not skip the rule
      # ("Dogecoin jumps as Musk leaves the Department of Government
      # Efficiency"); an explanation of its name does ("a nod/wink to/at",
      # "evokes", "referencing", "known as DOGE after", "a joke about", "like
      # the dogecoin memecoin"). Agency phrases ("DOGE team/staff/cuts/access/
      # service") skip it too, unless dogecoin is the subject of a price move
      # ("Dogecoin jumps 8% as DOGE team wraps up work"). "Dogecoin Cash" is a
      # fork; "Dogecoin cashes in" and "cash-out" are not.
      - pattern: "(?:(?<!baby )(?<!wrapped )(?<!peg )\\bdogecoin\\b(?!(?:['’]s)? (?:killers?|rivals?|copycats?|clones?|imitators?|knock-?offs?|wannabes?)\\b| cash\\b(?!-)| 2\\.0|-(?:style|themed|inspired|like)\\b| (?:meme|mascot|dog)\\b(?! ?coin))|(?<!베이비)(?<!베이비 )도지코인)"
        ignore_case: true
        requires: "^(?![\\s\\S]*(?:government efficiency[^.;]{0,80}?\\b(?:(?:nod|homage|tribute|allusion|reference|wink) (?:to|at)|(?:play|riff|pun) on|named (?:after|for)|inspired by|evok(?:es|ed|ing)|referenc(?:es|ed|ing)|allud(?:es|ed|ing) to|echo(?:es|ed|ing)(?= (?:the |its )?(?:dogecoin|meme|coin|cryptocurrency|name))|(?:known|called|dubbed|nicknamed) (?:as )?DOGE after|jok(?:e|ing) (?:about|on)|like (?:the )?dogecoin|(?:takes?|took|gets?|got|borrow(?:s|ed)?|derives?|derived|draws?|drew) its name|shares? (?:an? |its |the )?(?:name|acronym|moniker)|(?:lifted|taken|borrowed) from|namesake)\\b|정부 ?효율(?:성)?부[^.;]{0,80}?(?:이름|명칭|따온|따와|본뜬|본떠|오마주|착안)|\\bKabosu\\b|(?-i:\\bD(?:OGE|oge)\\b)(?!\\)| meme).{0,60}\\b(?:(?:nod|homage|tribute|allusion|reference|wink) (?:to|at)|(?:play|riff|pun) on|named (?:after|for)|inspired by|evok(?:es|ed|ing)|referenc(?:es|ed|ing)|allud(?:es|ed|ing) to|echo(?:es|ed|ing)(?= (?:the |its )?(?:dogecoin|meme|coin|cryptocurrency|name))|(?:known|called|dubbed|nicknamed) (?:as )?DOGE after|jok(?:e|ing) (?:about|on)|like (?:the )?dogecoin|(?:takes?|took|gets?|got|borrow(?:s|ed)?|derives?|derived|draws?|drew) its name|shares? (?:an? |its |the )?(?:name|acronym|moniker)|(?:lifted|taken|borrowed) from|namesake)\\b|\\b(?:(?:nod|homage|tribute|allusion|reference|wink) (?:to|at)|(?:play|riff|pun) on|named (?:after|for)|inspired by|evok(?:es|ed|ing)|referenc(?:es|ed|ing)|allud(?:es|ed|ing) to|jok(?:e|ing) (?:about|on))\\b[^.;]{0,40}?\\bdogecoin\\b[^.;]{0,40}?(?-i:\\bD(?:OGE|oge)\\b)(?!\\)| meme)))(?!(?![\\s\\S]*\\bdogecoin(?:['’]s)? (?:price )?(?:jump|rall|slide|slid|fall|fell|rise|rose|surge|drop|climb|slump|gain|dip|tumble|soar|sink|sank|spike|plunge|rebound|rip|pop|crash|slip|edge)\\w*)[\\s\\S]*\\bDOGE(?:['’]s)? (?:team|staff(?:ers?)?|cuts?(?! (?:losses|gains))|employees|officials|engineers|aides|access|operatives|service|subcommittee|caucus|dividend)\\b)"
      # The ticker DOGE is also the Department of Government Efficiency, so it
