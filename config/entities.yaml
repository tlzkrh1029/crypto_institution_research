  # --- projects (watch sample and control, docs/open-questions.md Q7) ---------
  - id: quant
    kind: project
    label: Quant
    tokens: [QNT]
    match:
      - pattern: "Quant Network|Overledger|\\bQNT\\b"
      - pattern: "\\bQuant\\b"
        requires: "tokeni[sz]|blockchain|ledger|on-?chain|interoperab|Clearing House|stablecoin|deposit|Overledger"

  - id: chainlink
    kind: project
    label: Chainlink
    tokens: [LINK]
    match:
      # The name or co-founder Sergey Nazarov, but not the fence (fence/mesh/gate right after it, fence-trade words anywhere; "on/off the fence", "ring-fence", "fence-sitters" and "defence" are fine), chain-link clothes and 4x4s, or other things called Chainlink (Research, Solutions, Gallery, Chronicle, a game 'mode', Services LLC).
      - pattern: "\\b(?:Chainlink|CHAINLINK|Sergey Nazarov)\\b(?!['’]? (?i:Research|Solutions|Gallery|Chronicle|mode)\\b| Services,? (?:LLC|LP|Inc))(?![- ]?(?i:fenc|mesh\\b|gates?\\b))"
        requires: "(?s)^(?!.*(?:barbed wire|vinyl[- ]coated|galvani[sz]ed (?:steel|wire)|(?<!ring[- ])(?<!on the )(?<!off the )\\bfenc(?:es?|ing)\\b(?!-sit)|\\b(?:dress|bikini|jeans|4[x×]4)\\b))"
      # "ChainLink" (the 2017-2019 spelling, also supply-chain firms) and lower-case "chainlink" (mostly the fence or fabric) need oracle, on-chain or crypto context ("Oracle" the company does not count).
      - pattern: "\\b(?:ChainLink|chainlink)\\b(?! (?i:Research|Solutions)\\b)(?![- ]?fenc)"
        requires: "(?-i:\\bLINK\\b|oracles?\\b|Oracles\\b)|oracle (?:network|node)|decentrali[sz]ed oracle|on-?chain|smart contract|DeFi|Nazarov|CCIP|CBDC|e-HKD|digital asset|crypto|altcoin"
      # LINK next to another crypto ticker ("SOL, AVAX and LINK"), except ETH Zurich; the requires skips the other LINKs: LINE's token, Interlink (Nasdaq: LINK), LINK Mobility, the Illinois LINK card.
      - pattern: "\\b(?:BTC|ETH|XRP|BNB|SOL|XLM|HBAR|AVAX|ADA|BCH|HYPE|DOGE|LTC|DOT|UNI|AAVE|CRO|FIL)(?:,| &|,? and|,? or) LINK\\b|\\bLINK(?:,| &|,? and|,? or) (?:BTC|ETH|XRP|BNB|SOL|XLM|HBAR|AVAX|ADA|BCH|HYPE|DOGE|LTC|DOT|UNI|AAVE|CRO|FIL)\\b(?! Z[uü]rich)"
        requires: "(?s)^(?!.*(?-i:\\bLINE\\b|Bitbox|Interlink|Mobility|Illinois))"
      # LINK as a traded asset: pairs (KRW-LINK, LINK/USD), amounts ("98,590 LINK", "$1.53M LINK"), "LINK token/ETF/fund/price" (not The LINK Fund, an Indian NGO), price moves ("LINK Surges 13%", "LINK to $200").
      - pattern: "\\b(?:KRW|USDT?|BTC)-LINK\\b|\\bLINK[-/](?:USD[TC]?|KRW|BTC|ETH|EUR)\\b|\\d[KMB]? LINK\\b(?! (?:card|ATM))|(?<!The )\\bLINK (?:[Tt]okens?|ET[FP]s?|[Ff]und(?! Solutions)|[Pp]rice)\\b|\\bLINK (?i:pops|jumps|surges|soars|gains|rises|climbs|rall(?:y|ies)|spikes|bounces|rebounds|falls|drops|slides|slips|dips|sinks|tumbles|plunges|(?:to|at|above|below) \\$)"
        requires: "(?s)^(?!.*(?-i:\\bLINE\\b|Bitbox|Interlink|Mobility|Illinois))"
      # The $LINK cashtag with crypto-market words; Interlink Electronics and LINK Mobility share it.
      - pattern: "\\$LINK\\b(?!\\.\\w)"
        requires: "(?s)^(?!.*(?-i:Interlink|LINK Mobility)).*(?:altcoin|DeFi|on-?chain|staking|whales?|oracle)"
      # CCIP (Cross-Chain Interoperability Protocol) with cross-chain, stablecoin or LINK context; not the ENS lookups CCIP-Read/CCIP-Write, the Medicare programme or CCI Paris.
      - pattern: "\\bCCIP\\b(?![- ]?(?i:read|write))"
        requires: "(?s)^(?!.*(?-i:\\bENS\\b)).*(?:cross-?chain|stablecoin|(?-i:\\bLINK\\b))"
      # The Chainlink fund tickers GLNK (Grayscale) and CLNK (Bitwise), with fund context.
      - pattern: "\\b[GC]LNK\\b"
        requires: "ET[FP]|exchange-traded|NYSE|Grayscale|Bitwise|crypto|tokeni"

  - id: ondo
