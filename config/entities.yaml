      - pattern: "^Block\\b(?![.\\-]| \\d| #|(?:['’]s)? (?i:rewards?|heights?|sizes?|times?|space|explorers?|producers?|builders?|proposers?|subsidy|trades?|chain|party|scholes|earner|street|headers?|hash)\\b)"
