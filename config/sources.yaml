# Sources polled by the collector.
#
# AGENTS.md: a source is added only after its terms of use were checked
# (docs/collector-spec.md section 3). `terms_checked` records where and when.
# Terms review: research/2026-09-30-claude-data-source-check/README.md
#
# Fields:
#   id, name, url
#   kind: feed (RSS/Atom) | sitemap
#   interval_sec: polling interval, >= 60
#   publisher_kind: institution | regulator | project | newswire | media
#   requires_env: skip the source until this .env value is set
#                 (its value is also sent as the User-Agent)
#   url_filter: sitemap only, regex applied to <loc>
#   max_age_days: sitemap only, ignore entries whose lastmod is older
#   store_excerpt: false keeps only title, link and dates in the database
#   publisher_entity: entity id of the institution that publishes the feed;
#                     every item counts as that institution speaking
#   enabled: false to keep an entry without polling it

sources:
  # SEC: public information, free to reuse; cite the SEC. Fair access policy:
  # declared User-Agent with a contact e-mail, <= 10 requests/second in total.
  - id: sec-press
    name: SEC press releases
    kind: feed
    url: https://www.sec.gov/news/pressreleases.rss
    interval_sec: 300
    publisher_kind: regulator
    requires_env: SEC_USER_AGENT
    terms_checked: "2026-09-30 sec.gov privacy/security policy and EDGAR fair access policy"

  - id: sec-speeches
    name: SEC speeches and statements
    kind: feed
    url: https://www.sec.gov/news/speeches-statements.rss
    interval_sec: 600
    publisher_kind: regulator
    requires_env: SEC_USER_AGENT
    terms_checked: "2026-09-30 sec.gov privacy/security policy and EDGAR fair access policy"

  # Federal Reserve Board: public domain unless marked; cite the Board.
  - id: fed-press
    name: Federal Reserve Board press releases
    kind: feed
    url: https://www.federalreserve.gov/feeds/press_all.xml
    interval_sec: 600
    publisher_kind: regulator
    terms_checked: "2026-09-30 federalreserve.gov disclaimer (public domain) and RSS page"

  # DTCC: RSS subscriptions are invited; the site licence is personal and
  # forbids compiling content into a database, so only title, link and date
  # are kept, privately. The RSS list has no press-release feed.
  - id: dtcc-insights
    name: DTCC Insights
    kind: feed
    url: https://www.dtcc.com/rss-feeds/dtcc-news-and-insight/dtcc-news-and-insight-connection.xml
    interval_sec: 900
    publisher_kind: institution
    publisher_entity: dtcc
    store_excerpt: false
    terms_checked: "2026-09-30 dtcc.com terms (2026-03-11) and RSS page"

  # Project feeds (research/2026-09-30-claude-project-feed-check/). A post
  # that names only the publishing project does not become an event.
  # Hedera terms (2025-11-24): no automated-access clause; no copying or
  # dissemination for commercial purposes. The feed carries full text, so only
  # title, link and date are kept. robots.txt asks for Crawl-delay 10.
  - id: hedera-blog
    name: Hedera blog
    kind: feed
    url: https://hedera.com/feed/
    interval_sec: 1800
    publisher_kind: project
    publisher_entity: hedera
    store_excerpt: false
    terms_checked: "2026-09-30 hedera.com terms (2025-11-24) and robots.txt"

  # Stellar terms (2026-03-23): personal, non-commercial use only; no copying
  # or publishing for public purposes. Kept privately; public records cite the
  # link only. The feed sends no ETag or Last-Modified.
  - id: stellar-blog
    name: Stellar blog
    kind: feed
    url: https://stellar.org/blog/rss.xml
    interval_sec: 1800
    publisher_kind: project
    publisher_entity: stellar
    store_excerpt: false
    terms_checked: "2026-09-30 stellar.org terms of service (2026-03-23) and robots.txt"

  # Not added (terms restrict it or are unclear; docs/open-questions.md Q10):
  # Chainlink press-release RSS (unclear), Quant /feed/ (terms forbid storing),
  # Ondo and Ripple (no feed; terms forbid automated extraction).

  # DTCC press releases are listed only in the sitemap. The terms forbid
  # systematic extraction; reading sitemap entries needs the user's decision
  # (docs/open-questions.md Q10). Kept disabled.
  - id: dtcc-press-sitemap
    name: DTCC press releases (sitemap)
    kind: sitemap
    url: https://www.dtcc.com/sitemap.xml
    url_filter: "/press-releases/"
    max_age_days: 30
    interval_sec: 1800
    publisher_kind: institution
    publisher_entity: dtcc
    store_excerpt: false
    enabled: false
    terms_checked: "2026-09-30 dtcc.com terms: unclear for sitemap reading; disabled"
